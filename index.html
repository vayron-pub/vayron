<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VAYRON | دار فايرون للنشر الرقمي</title>
  
  <!-- شعار الموقع الفاخر المدمج -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3CradialGradient id='bg' cx='50%25' cy='50%25' r='50%25'%3E%3Cstop offset='0%25' stop-color='%231c1917'/%3E%3Cstop offset='100%25' stop-color='%230c0a09'/%3E%3C/radialGradient%3E%3ClinearGradient id='gold' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23fef3c7'/%3E%3Cstop offset='30%25' stop-color='%23f59e0b'/%3E%3Cstop offset='70%25' stop-color='%23d97706'/%3E%3Cstop offset='100%25' stop-color='%2378350f'/%3E%3C/linearGradient%3E%3ClinearGradient id='dark' x1='100%25' y1='0%25' x2='0%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23b45309'/%3E%3Cstop offset='100%25' stop-color='%23451a03'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='120' fill='url(%23bg)'/%3E%3Crect width='506' height='506' x='3' y='3' rx='117' fill='none' stroke='url(%23gold)' stroke-width='4' opacity='0.4'/%3E%3Cpath d='M96 120 L204 120 L256 320 L216 320 L136 156 L96 156 Z' fill='url(%23gold)'/%3E%3Cpath d='M416 120 L308 120 L256 320 L296 320 L376 156 L416 156 Z' fill='url(%23dark)'/%3E%3Cpolygon points='256,130 286,290 256,430 226,290' fill='url(%23gold)'/%3E%3Cpolygon points='256,130 286,290 256,430' fill='%23000000' opacity='0.3'/%3E%3Cline x1='256' y1='240' x2='256' y2='390' stroke='%230c0a09' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='256' cy='235' r='5.5' fill='%230c0a09'/%3E%3C/svg%3E" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@600;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-amiri { font-family: 'Amiri', serif; }
  </style>
</head>
<body class="bg-[#0c0a09] text-stone-200 antialiased selection:bg-amber-600 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const WALLET_ADDRESS = "TJQ5vYmcmfXtp7L4SAtgGnL9onLkDLm6Q6";
    const NETWORK = "TRON (TRC20)";
    const ADMIN_KEY = "V@yR0n#9921_X!";
    const OFFICIAL_EMAIL = "contact@vayron.pub";

    const GENRES = [
      { id: 'psychological', labelAr: 'إثارة نفسية', labelEn: 'Psychological Thriller' },
      { id: 'mystery', labelAr: 'غموض وتحقيقات', labelEn: 'Mystery & Detective' },
      { id: 'horror', labelAr: 'رعب وما وراء الطبيعة', labelEn: 'Horror & Supernatural' },
      { id: 'suspense', labelAr: 'تشويق وحبس أنفاس', labelEn: 'Suspense & Crime' },
      { id: 'short_stories', labelAr: 'قصص قصيرة', labelEn: 'Dark Short Stories' },
      { id: 'scifi', labelAr: 'خيال علمي مظلم', labelEn: 'Dark Sci-Fi' }
    ];

    function App() {
      const [lang, setLang] = React.useState('ar');
      const [view, setView] = React.useState('home');
      const [isAdmin, setIsAdmin] = React.useState(false);
      const [adminTab, setAdminTab] = React.useState('manage'); // 'stats', 'publish', 'manage'
      const [manageSubTab, setManageSubTab] = React.useState('all'); // 'all', 'free', 'paid'
      const [publishType, setPublishType] = React.useState('both');
      const [showSecretModal, setShowSecretModal] = React.useState(false);
      const [adminPass, setAdminPass] = React.useState('');
      const [adminError, setAdminError] = React.useState(false);

      // حالة تعديل الرواية
      const [editingBook, setEditingBook] = React.useState(null);

      // العداد والمستخدمين والمبيعات
      const [viewsCount, setViewsCount] = React.useState(() => {
        const c = localStorage.getItem('vayron_views');
        return c ? parseInt(c, 10) : 1;
      });

      const [subscribers, setSubscribers] = React.useState(() => {
        const s = localStorage.getItem('vayron_subs');
        return s ? JSON.parse(s) : [];
      });

      const [orders, setOrders] = React.useState(() => {
        const o = localStorage.getItem('vayron_orders');
        return o ? JSON.parse(o) : [];
      });

      const [user, setUser] = React.useState(() => {
        const u = localStorage.getItem('vayron_user');
        return u ? JSON.parse(u) : null;
      });

      const [showGoogleModal, setShowGoogleModal] = React.useState(false);
      const [inputName, setInputName] = React.useState('');
      const [inputEmail, setInputEmail] = React.useState('');
      const [pendingAction, setPendingAction] = React.useState(null);

      // الكتب
      const [books, setBooks] = React.useState(() => {
        const b = localStorage.getItem('vayron_books');
        return b ? JSON.parse(b) : [];
      });

      const [selectedGenre, setSelectedGenre] = React.useState('all');
      const [checkoutData, setCheckoutData] = React.useState(null);
      const [copied, setCopied] = React.useState(false);

      // نموذج إضافة كتاب جديد
      const [newBook, setNewBook] = React.useState({
        type: 'both',
        titleAr: '',
        titleEn: '',
        genre: 'psychological',
        price: '4.99',
        isFree: false,
        desc: '',
        coverArData: '',
        coverEnData: '',
        pdfArData: '',
        pdfArName: '',
        pdfEnData: '',
        pdfEnName: ''
      });

      React.useEffect(() => {
        if (!sessionStorage.getItem('counted')) {
          const next = viewsCount + 1;
          setViewsCount(next);
          localStorage.setItem('vayron_views', next.toString());
          sessionStorage.setItem('counted', '1');
        }
      }, []);

      React.useEffect(() => {
        const onKey = (e) => {
          if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a' || e.code === 'KeyA')) {
            e.preventDefault();
            setShowSecretModal(true);
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const clickCountRef = React.useRef(0);
      const handleLogoTripleClick = () => {
        clickCountRef.current += 1;
        if (clickCountRef.current >= 3) {
          setShowSecretModal(true);
          clickCountRef.current = 0;
        }
        setTimeout(() => { clickCountRef.current = 0; }, 1200);
      };

      const handleImageUpload = (e, targetField, isEdit = false) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            if (isEdit) {
              setEditingBook(prev => ({ ...prev, [targetField]: ev.target.result }));
            } else {
              setNewBook(prev => ({ ...prev, [targetField]: ev.target.result }));
            }
          };
          reader.readAsDataURL(file);
        }
      };

      const handlePdfUpload = (e, langType, isEdit = false) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            if (isEdit) {
              if (langType === 'ar') {
                setEditingBook(prev => ({ ...prev, pdfArData: ev.target.result, pdfArName: file.name }));
              } else {
                setEditingBook(prev => ({ ...prev, pdfEnData: ev.target.result, pdfEnName: file.name }));
              }
            } else {
              if (langType === 'ar') {
                setNewBook(prev => ({ ...prev, pdfArData: ev.target.result, pdfArName: file.name }));
              } else {
                setNewBook(prev => ({ ...prev, pdfEnData: ev.target.result, pdfEnName: file.name }));
              }
            }
          };
          reader.readAsDataURL(file);
        }
      };

      const copyAddress = () => {
        navigator.clipboard.writeText(WALLET_ADDRESS);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        const mail = inputEmail.trim() || 'reader@vayron.pub';
        const name = inputName.trim() || mail.split('@')[0];
        const newUser = {
          name,
          email: mail,
          avatar: `https://api.dicebear.com/7.x/initials/svg?seed=${name}&backgroundColor=b45309`,
          date: new Date().toLocaleString('ar-EG')
        };
        setUser(newUser);
        localStorage.setItem('vayron_user', JSON.stringify(newUser));

        if (!subscribers.some(s => s.email.toLowerCase() === mail.toLowerCase())) {
          const updatedSubs = [newUser, ...subscribers];
          setSubscribers(updatedSubs);
          localStorage.setItem('vayron_subs', JSON.stringify(updatedSubs));
        }

        setShowGoogleModal(false);
        setInputName('');
        setInputEmail('');

        if (pendingAction) {
          pendingAction(newUser);
          setPendingAction(null);
        }
      };

      const handleBuy = (book, edition) => {
        const executeCheckout = (activeUser) => {
          setCheckoutData({ book, edition });
          const newOrder = {
            id: Date.now(),
            bookTitle: edition === 'ar' ? (book.titleAr || book.titleEn) : (book.titleEn || book.titleAr),
            edition: edition === 'ar' ? 'النسخة العربية' : 'English Edition',
            price: book.price,
            userEmail: activeUser.email,
            userName: activeUser.name,
            date: new Date().toLocaleString('ar-EG')
          };
          const updatedOrders = [newOrder, ...orders];
          setOrders(updatedOrders);
          localStorage.setItem('vayron_orders', JSON.stringify(updatedOrders));
          setView('checkout');
        };

        if (!user) {
          setPendingAction(() => (u) => executeCheckout(u));
          setShowGoogleModal(true);
        } else {
          executeCheckout(user);
        }
      };

      const handleRead = (book, edition) => {
        const fileData = edition === 'ar' ? book.pdfArData : (book.pdfEnData || book.pdfArData);
        const executeOpen = () => {
          if (fileData) {
            const win = window.open();
            win.document.write(`<iframe src="${fileData}" frameborder="0" style="border:0; top:0px; left:0px; bottom:0px; right:0px; width:100%; height:100%;" allowfullscreen></iframe>`);
          } else {
            alert('لم يتم إرفاق ملف PDF لهذه النسخة بعد.');
          }
        };

        if (!user) {
          setPendingAction(() => () => executeOpen());
          setShowGoogleModal(true);
        } else {
          executeOpen();
        }
      };

      const handleAddBook = (e) => {
        e.preventDefault();
        const defaultCover = 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80';
        const b = {
          ...newBook,
          id: Date.now(),
          type: publishType,
          price: newBook.isFree ? '0.00' : newBook.price,
          coverArData: newBook.coverArData || defaultCover,
          coverEnData: newBook.coverEnData || defaultCover
        };

        const updated = [b, ...books];
        setBooks(updated);
        localStorage.setItem('vayron_books', JSON.stringify(updated));
        alert('تم نشر الرواية بنجاح!');
        setNewBook({
          type: publishType,
          titleAr: '',
          titleEn: '',
          genre: 'psychological',
          price: '4.99',
          isFree: false,
          desc: '',
          coverArData: '',
          coverEnData: '',
          pdfArData: '',
          pdfArName: '',
          pdfEnData: '',
          pdfEnName: ''
        });
        setAdminTab('manage');
      };

      // حفظ التعديلات على الرواية الحالية
      const handleSaveEdit = (e) => {
        e.preventDefault();
        const updated = books.map(b => {
          if (b.id === editingBook.id) {
            return {
              ...editingBook,
              price: editingBook.isFree ? '0.00' : editingBook.price
            };
          }
          return b;
        });
        setBooks(updated);
        localStorage.setItem('vayron_books', JSON.stringify(updated));
        alert('تم حفظ وتحديث بيانات الرواية بنجاح!');
        setEditingBook(null);
      };

      const handleDeleteBook = (id) => {
        if (confirm('هل تريد حذف هذه الرواية من المتجر نهائياً؟')) {
          const updated = books.filter(b => b.id !== id);
          setBooks(updated);
          localStorage.setItem('vayron_books', JSON.stringify(updated));
        }
      };

      const filteredBooks = selectedGenre === 'all' 
        ? books 
        : books.filter(b => b.genre === selectedGenre);

      // تصفية كتب لوحة الإدارة
      const managedBooks = books.filter(b => {
        if (manageSubTab === 'free') return b.isFree;
        if (manageSubTab === 'paid') return !b.isFree;
        return true;
      });

      return (
        <div className="min-h-screen flex flex-col justify-between" dir={lang === 'ar' ? 'rtl' : 'ltr'}>
          {/* Header */}
          <header className="border-b border-stone-800 bg-stone-950/80 backdrop-blur px-6 py-4 flex justify-between items-center sticky top-0 z-40">
            <div className="flex items-center gap-3 cursor-pointer select-none" onClick={handleLogoTripleClick} title="انقر 3 مرات متتالية لفتح لوحة الإدارة">
              <h1 className="text-3xl font-cinzel tracking-widest text-amber-500 font-bold hover:opacity-80 transition">VAYRON</h1>
              <span className="text-[10px] text-stone-500 border-r border-stone-800 pr-3 hidden sm:inline font-cinzel">
                NOTHING IS WHAT IT SEEMS
              </span>
            </div>

            <nav className="flex items-center gap-4 text-sm">
              <button onClick={() => setView('home')} className={view === 'home' ? 'text-amber-400 font-bold' : 'text-stone-400'}>
                {lang === 'ar' ? 'الرئيسية' : 'Home'}
              </button>
              <button onClick={() => setView('books')} className={view === 'books' ? 'text-amber-400 font-bold' : 'text-stone-400'}>
                {lang === 'ar' ? 'المكتبة' : 'Library'} ({books.length})
              </button>

              {isAdmin && (
                <button onClick={() => setView('admin')} className="text-xs bg-amber-950/50 border border-amber-600/40 text-amber-400 px-3 py-1 rounded flex items-center gap-1.5">
                  <i className="fa-solid fa-gauge-high"></i>
                  <span>لوحة الإدارة</span>
                </button>
              )}

              {/* تبديل لغة الموقع */}
              <div className="flex bg-stone-900 border border-stone-800 rounded-full p-0.5 text-xs">
                <button onClick={() => setLang('ar')} className={`px-2 py-0.5 rounded-full ${lang === 'ar' ? 'bg-amber-600 text-stone-950 font-bold' : 'text-stone-400'}`}>عربي</button>
                <button onClick={() => setLang('en')} className={`px-2 py-0.5 rounded-full ${lang === 'en' ? 'bg-amber-600 text-stone-950 font-bold' : 'text-stone-400'}`}>EN</button>
              </div>

              {/* حساب المستخدم */}
              {user ? (
                <div className="flex items-center gap-2 bg-stone-900 px-3 py-1 rounded-full border border-stone-800 text-xs">
                  <img src={user.avatar} className="w-5 h-5 rounded-full" alt="" />
                  <span className="max-w-[80px] truncate">{user.name}</span>
                  <button onClick={() => { setUser(null); localStorage.removeItem('vayron_user'); }} className="text-rose-400 mr-1" title="تسجيل الخروج">
                    <i className="fa-solid fa-power-off"></i>
                  </button>
                </div>
              ) : (
                <button onClick={() => setShowGoogleModal(true)} className="bg-stone-900 border border-stone-700 text-stone-300 text-xs px-3 py-1.5 rounded-full flex items-center gap-2">
                  <i className="fa-brands fa-google text-amber-500"></i>
                  <span>{lang === 'ar' ? 'دخول Google' : 'Google Sign in'}</span>
                </button>
              )}
            </nav>
          </header>

          {/* محتوى الصفحات */}
          <main className="flex-1 max-w-6xl mx-auto px-6 py-10 w-full">
            {/* الرئيسية */}
            {view === 'home' && (
              <div className="space-y-16 py-6">
                <div className="text-center space-y-6 max-w-3xl mx-auto">
                  <span className="text-xs uppercase tracking-widest text-amber-500 border border-amber-500/20 bg-amber-950/20 px-4 py-1.5 rounded-full font-cinzel">
                    DIGITAL PUBLISHING HOUSE
                  </span>
                  <h2 className="text-4xl sm:text-6xl font-bold font-amiri leading-tight">
                    {lang === 'ar' ? 'حيث لا شيء كما يبدو في عتمة السطور' : 'Where nothing is what it seems beneath the shadow of words'}
                  </h2>
                  <p className="text-stone-400 text-base font-light">
                    {lang === 'ar' 
                      ? 'المنصة الرقمية المتخصصة في أدب الغموض، التحقيقات، وحبكات الإثارة النفسية المعاصرة باللغتين العربية والإنجليزية.'
                      : 'The premier digital sanctum for contemporary mystery, psychological noir, and atmospheric fiction in Arabic and English editions.'}
                  </p>
                  <div>
                    <button onClick={() => setView('books')} className="bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold px-8 py-3 rounded-xl shadow-lg transition">
                      {lang === 'ar' ? `استكشف المكتبة (${books.length})` : `Explore Library (${books.length})`}
                    </button>
                  </div>
                </div>

                <div className="bg-stone-900/60 border border-stone-800 rounded-3xl p-8 sm:p-10">
                  <h3 className="text-2xl font-bold font-cinzel text-amber-500 mb-3">VAYRON</h3>
                  <p className="text-stone-300 text-sm leading-relaxed">
                    {lang === 'ar'
                      ? 'فايرون (VAYRON) دار نشر رقمية رائدة متخصصة في أدب الغموض والإثارة النفسية، تقدم أعمالها بطبعات ثنائية اللغة لربط القارئ العربي بالعالمية.'
                      : 'VAYRON is an avant-garde digital publishing house specializing in psychological suspense and noir mysteries with dual-language accessibility.'}
                  </p>
                </div>
              </div>
            )}

            {/* المكتبة */}
            {view === 'books' && (
              <div className="space-y-8">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-stone-800 pb-4">
                  <div>
                    <h3 className="text-2xl font-bold text-stone-100 font-amiri">{lang === 'ar' ? 'المكتبة المنشورة' : 'Published Works'}</h3>
                    <p className="text-xs text-stone-500 mt-1">تصفح الروايات واختر نسختك المفضلة (العربية أو الإنجليزية)</p>
                  </div>
                  <div className="flex gap-1.5 flex-wrap text-xs">
                    <button onClick={() => setSelectedGenre('all')} className={`px-3 py-1.5 rounded-lg ${selectedGenre === 'all' ? 'bg-amber-600 text-stone-950 font-bold' : 'bg-stone-900 text-stone-400'}`}>
                      {lang === 'ar' ? 'الكل' : 'All'}
                    </button>
                    {GENRES.map(g => (
                      <button key={g.id} onClick={() => setSelectedGenre(g.id)} className={`px-3 py-1.5 rounded-lg ${selectedGenre === g.id ? 'bg-amber-600 text-stone-950 font-bold' : 'bg-stone-900 text-stone-400'}`}>
                        {lang === 'ar' ? g.labelAr : g.labelEn}
                      </button>
                    ))}
                  </div>
                </div>

                {filteredBooks.length === 0 ? (
                  <div className="text-center py-16 text-stone-500 text-sm bg-stone-900/30 rounded-2xl border border-stone-800">
                    {lang === 'ar' ? 'لا توجد روايات منشورة في هذا القسم حالياً.' : 'No books in this section yet.'}
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {filteredBooks.map(book => {
                      const isBoth = (!book.type || book.type === 'both');
                      const isArOnly = book.type === 'ar_only';
                      const isEnOnly = book.type === 'en_only';

                      return (
                        <div key={book.id} className="bg-stone-900/80 border border-stone-800 rounded-3xl p-5 flex flex-col justify-between hover:border-amber-500/30 transition shadow-xl">
                          <div>
                            <div className="flex justify-between items-center mb-3">
                              <span className="text-[10px] bg-amber-950/60 text-amber-400 border border-amber-800/40 px-2.5 py-0.5 rounded-full">
                                {GENRES.find(g => g.id === book.genre)?.[lang === 'ar' ? 'labelAr' : 'labelEn'] || book.genre}
                              </span>
                              {isBoth && (
                                <span className="text-[10px] bg-stone-950 text-amber-300 border border-amber-600/30 px-2.5 py-0.5 rounded-full font-mono">
                                  🌐 Dual Edition (نسختان)
                                </span>
                              )}
                              {isArOnly && (
                                <span className="text-[10px] bg-stone-950 text-emerald-400 border border-emerald-600/30 px-2 py-0.5 rounded-full">
                                  🇸🇦 طبعة عربية
                                </span>
                              )}
                              {isEnOnly && (
                                <span className="text-[10px] bg-stone-950 text-sky-400 border border-sky-600/30 px-2 py-0.5 rounded-full font-cinzel">
                                  🇬🇧 English Edition
                                </span>
                              )}
                            </div>

                            {isBoth ? (
                              <div className="grid grid-cols-2 gap-3 bg-stone-950 p-2.5 rounded-2xl border border-stone-800/80 mb-4">
                                <div className="space-y-1.5 text-center">
                                  <div className="relative group overflow-hidden rounded-xl border border-stone-800">
                                    <img src={book.coverArData || book.coverEnData} className="w-full h-44 object-cover group-hover:scale-105 transition duration-300" alt="Arabic Cover" />
                                    <span className="absolute bottom-1 right-1 bg-black/70 backdrop-blur-sm text-[9px] text-amber-300 px-1.5 py-0.5 rounded">عربي</span>
                                  </div>
                                  <p className="text-[11px] font-bold text-stone-200 truncate font-amiri">{book.titleAr || 'النسخة العربية'}</p>
                                </div>

                                <div className="space-y-1.5 text-center">
                                  <div className="relative group overflow-hidden rounded-xl border border-stone-800">

                    {/* سجل المبيعات */}
                    <div className="bg-stone-900 p-6 rounded-2xl border border-stone-800 space-y-4">
                      <h4 className="font-bold text-stone-200 flex items-center gap-2">
                        <i className="fa-solid fa-money-bill-wave text-amber-400"></i>
                        <span>سجل عمليات الشراء والمبيعات (USDT)</span>
                      </h4>
                      {orders.length === 0 ? (
                        <p className="text-xs text-stone-500">لا توجد عمليات شراء مسجلة بعد.</p>
                      ) : (
                        <div className="overflow-x-auto">
                          <table className="w-full text-xs text-right">
                            <thead className="text-stone-400 border-b border-stone-800">
                              <tr>
                                <th className="p-2">الرواية</th>
                                <th className="p-2">النسخة</th>
                                <th className="p-2">المبلغ</th>
                                <th className="p-2">الزبون</th>
                                <th className="p-2">التاريخ</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-stone-800/60">
                              {orders.map(o => (
                                <tr key={o.id}>
                                  <td className="p-2 font-bold text-stone-200">{o.bookTitle}</td>
                                  <td className="p-2 text-amber-400">{o.edition}</td>
                                  <td className="p-2 font-mono">${o.price}</td>
                                  <td className="p-2 text-stone-400">{o.userEmail}</td>
                                  <td className="p-2 text-stone-500 font-mono">{o.date}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      )}
                    </div>

                    {/* سجل المشتركين */}
                    <div className="bg-stone-900 p-6 rounded-2xl border border-stone-800 space-y-4">
                      <h4 className="font-bold text-stone-200 flex items-center gap-2">
                        <i className="fa-solid fa-user-check text-emerald-400"></i>
                        <span>سجل الزوار المسجلين بحسابات Google</span>
                      </h4>
                      {subscribers.length === 0 ? (
                        <p className="text-xs text-stone-500">لم يسجل أي زائر حسابه بعد.</p>
                      ) : (
                        <div className="overflow-x-auto">
                          <table className="w-full text-xs text-right">
                            <thead className="text-stone-400 border-b border-stone-800">
                              <tr>
                                <th className="p-2">الاسم</th>
                                <th className="p-2">البريد الإلكتروني</th>
                                <th className="p-2">تاريخ التسجيل</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-stone-800/60">
                              {subscribers.map((s, idx) => (
                                <tr key={idx}>
                                  <td className="p-2 font-bold flex items-center gap-2">
                                    <img src={s.avatar} className="w-5 h-5 rounded-full" alt="" />
                                    <span>{s.name}</span>
                                  </td>
                                  <td className="p-2 text-amber-300 font-mono">{s.email}</td>
                                  <td className="p-2 text-stone-500 font-mono">{s.date}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* نافذة تعديل الرواية المنبثقة (Edit Modal) */}
          {editingBook && (
            <div className="fixed inset-0 bg-stone-950/90 backdrop-blur z-50 flex items-center justify-center p-4">
              <div className="bg-stone-900 border border-stone-700 w-full max-w-2xl rounded-3xl p-6 text-right max-h-[90vh] overflow-y-auto space-y-5" dir="rtl">
                <div className="flex justify-between items-center border-b border-stone-800 pb-3">
                  <h4 className="font-bold text-amber-400 text-lg flex items-center gap-2">
                    <i className="fa-solid fa-pen-to-square"></i>
                    <span>تعديل بيانات الرواية وتغيير حالتها</span>
                  </h4>
                  <button onClick={() => setEditingBook(null)} className="text-stone-400 hover:text-white">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <form onSubmit={handleSaveEdit} className="space-y-4">
                  
                  {/* زر التبديل الفوري: مجانية أو مدفوعة */}
                  <div className="bg-stone-950 p-4 rounded-2xl border border-stone-800 flex justify-between items-center">
                    <div>
                      <p className="text-xs font-bold text-stone-200">حالة الرواية الحالية:</p>
                      <p className="text-[11px] text-stone-400 mt-0.5">يمكنك جعلها مجانية أو مدفوعة في أي لحظة</p>
                    </div>

                    <label className="flex items-center gap-2 cursor-pointer bg-stone-900 px-4 py-2 rounded-xl border border-stone-700">
                      <input 
                        type="checkbox" 
                        checked={editingBook.isFree} 
                        onChange={e => setEditingBook({...editingBook, isFree: e.target.checked})} 
                        className="w-4 h-4 accent-emerald-500" 
                      />
                      <span className={`text-xs font-bold ${editingBook.isFree ? 'text-emerald-400' : 'text-stone-400'}`}>
                        {editingBook.isFree ? 'الرواية مجانية (Free)' : 'الرواية مدفوعة'}
                      </span>
                    </label>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="text-xs text-stone-400 block mb-1">اسم الرواية بالعربية</label>
                      <input type="text" value={editingBook.titleAr} onChange={e => setEditingBook({...editingBook, titleAr: e.target.value})} className="w-full bg-stone-950 border border-stone-800 p-2 rounded-lg text-xs" />
                    </div>
                    <div>
                      <label className="text-xs text-stone-400 block mb-1 font-cinzel">English Title</label>
                      <input type="text" value={editingBook.titleEn} onChange={e => setEditingBook({...editingBook, titleEn: e.target.value})} className="w-full bg-stone-950 border border-stone-800 p-2 rounded-lg text-xs text-left font-cinzel" />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="text-xs text-stone-400 block mb-1">القسم والتصنيف</label>
                      <select value={editingBook.genre} onChange={e => setEditingBook({...editingBook, genre: e.target.value})} className="w-full bg-stone-950 border border-stone-800 p-2 rounded-lg text-xs">
                        {GENRES.map(g => <option key={g.id} value={g.id}>{g.labelAr}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-xs text-stone-400 block mb-1">السعر بالـ (USDT)</label>
                      <input 
                        disabled={editingBook.isFree} 
                        type="number" 
                        step="0.5" 
                        value={editingBook.isFree ? '0.00' : editingBook.price} 
                        onChange={e => setEditingBook({...editingBook, price: e.target.value})} 
                        className={`w-full bg-stone-950 border border-stone-800 p-2 rounded-lg text-xs ${editingBook.isFree ? 'opacity-50 text-emerald-400' : 'text-stone-200'}`} 
                      />
                    </div>
                  </div>

                  {/* تعديل الأغلفة والملفات إن أردت */}
                  <div className="bg-stone-950 p-3 rounded-xl border border-stone-800 space-y-3">
                    <p className="text-xs text-stone-400 font-bold">تحديث الملفات والأغلفة (اختياري):</p>
                    <div className="grid grid-cols-2 gap-3 text-xs">
                      <div>
                        <label className="text-[11px] text-stone-400 block mb-1">استبدال غلاف النسخة العربية</label>
                        <input type="file" accept="image/*" onChange={e => handleImageUpload(e, 'coverArData', true)} className="text-[10px] text-stone-500 w-full" />
                      </div>
                      <div>
                        <label className="text-[11px] text-stone-400 block mb-1">استبدال غلاف النسخة الإنجليزية</label>
                        <input type="file" accept="image/*" onChange={e => handleImageUpload(e, 'coverEnData', true)} className="text-[10px] text-stone-500 w-full" />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-3 text-xs pt-2 border-t border-stone-900">
                      <div>
                        <label className="text-[11px] text-stone-400 block mb-1">استبدال PDF العربي</label>
                        <input type="file" accept="application/pdf" onChange={e => handlePdfUpload(e, 'ar', true)} className="text-[10px] text-stone-500 w-full" />
                      </div>
                      <div>
                        <label className="text-[11px] text-stone-400 block mb-1">استبدال PDF الإنجليزي</label>
                        <input type="file" accept="application/pdf" onChange={e => handlePdfUpload(e, 'en', true)} className="text-[10px] text-stone-500 w-full" />
                      </div>
                    </div>
                  </div>

                  <div>
                    <label className="text-xs text-stone-400 block mb-1">النبذة التشويقية</label>
                    <textarea rows="2" value={editingBook.desc} onChange={e => setNewBook({...editingBook, desc: e.target.value})} className="w-full bg-stone-950 border border-stone-800 p-2 rounded-lg text-xs"></textarea>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button type="submit" className="flex-1 bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold py-2.5 rounded-xl text-xs transition">
                      حفظ وتحديث التغييرات فوراً
                    </button>
                    <button type="button" onClick={() => setEditingBook(null)} className="bg-stone-800 px-4 py-2.5 rounded-xl text-xs text-stone-300">
                      إلغاء
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* نافذة تسجيل الدخول للزبائن */}
          {showGoogleModal && (
            <div className="fixed inset-0 bg-stone-950/90 backdrop-blur z-50 flex items-center justify-center p-4">
              <div className="bg-stone-900 border border-stone-800 max-w-sm w-full p-6 rounded-2xl text-center space-y-4">
                <i className="fa-brands fa-google text-2xl text-amber-500"></i>
                <h3 className="text-lg font-bold">تسجيل الدخول للمتابعة</h3>
                <form onSubmit={handleLoginSubmit} className="space-y-3 text-right">
                  <input required type="text" placeholder="الاسم" value={inputName} onChange={e => setInputName(e.target.value)} className="w-full bg-stone-950 border border-stone-800 p-2.5 rounded-lg text-xs text-stone-200" />
                  <input required type="email" placeholder="البريد الإلكتروني" value={inputEmail} onChange={e => setInputEmail(e.target.value)} className="w-full bg-stone-950 border border-stone-800 p-2.5 rounded-lg text-xs text-left text-stone-200" />
                  <button type="submit" className="w-full bg-amber-600 font-bold text-stone-950 py-2.5 rounded-lg text-xs">تأكيد ومتابعة</button>
                </form>
                <button onClick={() => setShowGoogleModal(false)} className="text-xs text-stone-500">إلغاء</button>
              </div>
            </div>
          )}

          {/* نافذة الدخول السري */}
          {showSecretModal && (
            <div className="fixed inset-0 bg-stone-950/95 z-50 flex items-center justify-center p-4">
              <div className="bg-stone-900 border border-stone-700 max-w-sm w-full p-6 rounded-2xl text-center space-y-4">
                <i className="fa-solid fa-key text-amber-500 text-xl"></i>
                <h3 className="font-bold font-cinzel text-stone-100">RESTRICTED ACCESS</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  if (adminPass === ADMIN_KEY) {
                    setIsAdmin(true);
                    setShowSecretModal(false);
                    setAdminPass('');
                    setAdminError(false);
                    setView('admin');
                  } else {
                    setAdminError(true);
                  }
                }} className="space-y-3">
                  <input type="password" placeholder="مفتاح الأمان السري..." value={adminPass} onChange={e => setAdminPass(e.target.value)} className="w-full bg-stone-950 border border-stone-700 p-2 rounded text-xs text-center text-amber-400 font-mono" />
                  {adminError && <p className="text-xs text-rose-500">المفتاح غير صالح!</p>}
                  <button type="submit" className="w-full bg-amber-600 font-bold text-stone-950 py-2 rounded text-xs">دخول</button>
                </form>
                <button onClick={() => setShowSecretModal(false)} className="text-xs text-stone-500">إلغاء</button>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-stone-900 py-6 text-center text-xs text-stone-500">
            <p className="font-cinzel tracking-wider text-stone-400">VAYRON PUBLISHING HOUSE</p>
            <p>© 2026 دار فايرون للنشر الرقمي. {OFFICIAL_EMAIL}</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
