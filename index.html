<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VAYRON | دار فايرون للنشر الرقمي</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@600;800&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-amiri { font-family: 'Amiri', serif; }
  </style>
</head>
<body class="bg-[#0c0a09] text-stone-200 antialiased selection:bg-amber-600 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const WALLET_ADDRESS = "TJQ5vYmcmfXtp7L4SAtgGnL9onLkDLm6Q6";
    const NETWORK = "TRON (TRC20)";
    const ADMIN_KEY = "V@yR0n#9921_X!";
    const OFFICIAL_EMAIL = "contact@vayron.pub";

    const GENRES = [
      { id: 'psychological', labelAr: 'إثارة نفسية', labelEn: 'Psychological Thriller' },
      { id: 'mystery', labelAr: 'غموض وتحقيقات', labelEn: 'Mystery & Detective' },
      { id: 'horror', labelAr: 'رعب وما وراء الطبيعة', labelEn: 'Horror & Supernatural' },
      { id: 'suspense', labelAr: 'تشويق وحبس أنفاس', labelEn: 'Suspense & Crime' },
      { id: 'short_stories', labelAr: 'قصص قصيرة', labelEn: 'Dark Short Stories' },
      { id: 'scifi', labelAr: 'خيال علمي مظلم', labelEn: 'Dark Sci-Fi' }
    ];

    function App() {
      const [lang, setLang] = React.useState('ar');
      const [view, setView] = React.useState('home');
      const [isAdmin, setIsAdmin] = React.useState(false);
      const [showSecretModal, setShowSecretModal] = React.useState(false);
      const [adminPass, setAdminPass] = React.useState('');
      const [adminError, setAdminError] = React.useState(false);

      // العداد والمستخدمين
      const [viewsCount, setViewsCount] = React.useState(() => {
        const c = localStorage.getItem('vayron_views');
        return c ? parseInt(c, 10) : 1;
      });

      const [subscribers, setSubscribers] = React.useState(() => {
        const s = localStorage.getItem('vayron_subs');
        return s ? JSON.parse(s) : [];
      });

      const [user, setUser] = React.useState(() => {
        const u = localStorage.getItem('vayron_user');
        return u ? JSON.parse(u) : null;
      });

      const [showGoogleModal, setShowGoogleModal] = React.useState(false);
      const [inputName, setInputName] = React.useState('');
      const [inputEmail, setInputEmail] = React.useState('');
      const [pendingAction, setPendingAction] = React.useState(null);

      // الكتب
      const [books, setBooks] = React.useState(() => {
        const b = localStorage.getItem('vayron_books');
        return b ? JSON.parse(b) : [];
      });

      const [selectedGenre, setSelectedGenre] = React.useState('all');
      const [checkoutData, setCheckoutData] = React.useState(null);
      const [copied, setCopied] = React.useState(false);

      // نموذج إضافة رواية
      const [newBook, setNewBook] = React.useState({
        titleAr: '',
        titleEn: '',
        genre: 'psychological',
        price: '4.99',
        isFree: false,
        desc: '',
        coverUrl: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80',
        pdfUrlAr: '',
        pdfUrlEn: ''
      });

      // زيادة العداد
      React.useEffect(() => {
        if (!sessionStorage.getItem('counted')) {
          const next = viewsCount + 1;
          setViewsCount(next);
          localStorage.setItem('vayron_views', next.toString());
          sessionStorage.setItem('counted', '1');
        }
      }, []);

      // اختصار الإدارة Ctrl + Shift + A
      React.useEffect(() => {
        const onKey = (e) => {
          if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
            e.preventDefault();
            setShowSecretModal(true);
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const copyAddress = () => {
        navigator.clipboard.writeText(WALLET_ADDRESS);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        const mail = inputEmail.trim() || 'reader@vayron.pub';
        const name = inputName.trim() || mail.split('@')[0];
        const newUser = {
          name,
          email: mail,
          avatar: `https://api.dicebear.com/7.x/initials/svg?seed=${name}&backgroundColor=b45309`,
          date: new Date().toLocaleDateString('ar-EG')
        };
        setUser(newUser);
        localStorage.setItem('vayron_user', JSON.stringify(newUser));

        if (!subscribers.some(s => s.email.toLowerCase() === mail.toLowerCase())) {
          const updatedSubs = [newUser, ...subscribers];
          setSubscribers(updatedSubs);
          localStorage.setItem('vayron_subs', JSON.stringify(updatedSubs));
        }

        setShowGoogleModal(false);
        setInputName('');
        setInputEmail('');

        if (pendingAction) {
          pendingAction();
          setPendingAction(null);
        }
      };

      const handleBuy = (book, edition) => {
        if (!user) {
          setPendingAction(() => () => {
            setCheckoutData({ book, edition });
            setView('checkout');
          });
          setShowGoogleModal(true);
        } else {
          setCheckoutData({ book, edition });
          setView('checkout');
        }
      };

      const handleRead = (book, edition) => {
        const link = edition === 'ar' ? book.pdfUrlAr : (book.pdfUrlEn || book.pdfUrlAr);
        if (!user) {
          setPendingAction(() => () => {
            if (link) window.open(link, '_blank');
            else alert('جاري تجهيز الرواية للتحميل قريباً');
          });
          setShowGoogleModal(true);
        } else {
          if (link) window.open(link, '_blank');
          else alert('جاري تجهيز الرواية للتحميل قريباً');
        }
      };

      const handleAddBook = (e) => {
        e.preventDefault();
        if (!newBook.titleAr && !newBook.titleEn) return;
        const b = {
          ...newBook,
          id: Date.now(),
          price: newBook.isFree ? '0.00' : newBook.price
        };
        const updated = [b, ...books];
        setBooks(updated);
        localStorage.setItem('vayron_books', JSON.stringify(updated));
        alert('تم نشر الرواية بنجاح!');
        setNewBook({
          titleAr: '',
          titleEn: '',
          genre: 'psychological',
          price: '4.99',
          isFree: false,
          desc: '',
          coverUrl: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80',
          pdfUrlAr: '',
          pdfUrlEn: ''
        });
        setView('books');
      };

      const handleDeleteBook = (id) => {
        if (confirm('تأكيد حذف الرواية؟')) {
          const updated = books.filter(b => b.id !== id);
          setBooks(updated);
          localStorage.setItem('vayron_books', JSON.stringify(updated));
        }
      };

      const filteredBooks = selectedGenre === 'all' 
        ? books 
        : books.filter(b => b.genre === selectedGenre);

      return (
        <div className="min-h-screen flex flex-col justify-between" dir={lang === 'ar' ? 'rtl' : 'ltr'}>
          {/* Header */}
          <header className="border-b border-stone-800 bg-stone-950/80 backdrop-blur px-6 py-4 flex justify-between items-center sticky top-0 z-40">
            <div className="flex items-center gap-3 cursor-pointer select-none" onClick={() => setView('home')}>
              <h1 className="text-3xl font-cinzel tracking-widest text-amber-500 font-bold">VAYRON</h1>
              <span className="text-[10px] text-stone-500 border-r border-stone-800 pr-3 hidden sm:inline font-cinzel">
                NOTHING IS WHAT IT SEEMS
              </span>
            </div>

            <nav className="flex items-center gap-4 text-sm">
              <button onClick={() => setView('home')} className={view === 'home' ? 'text-amber-400 font-bold' : 'text-stone-400'}>
                {lang === 'ar' ? 'الرئيسية' : 'Home'}
              </button>
              <button onClick={() => setView('books')} className={view === 'books' ? 'text-amber-400 font-bold' : 'text-stone-400'}>
                {lang === 'ar' ? 'المكتبة' : 'Library'} ({books.length})
              </button>

              {isAdmin && (
                <button onClick={() => setView('admin')} className="text-xs bg-amber-950/50 border border-amber-600/40 text-amber-400 px-3 py-1 rounded">
                  {lang === 'ar' ? 'لوحة الإدارة' : 'Admin'}
                </button>
              )}

              {/* تبديل اللغة */}
              <div className="flex bg-stone-900 border border-stone-800 rounded-full p-0.5 text-xs">
                <button onClick={() => setLang('ar')} className={`px-2 py-0.5 rounded-full ${lang === 'ar' ? 'bg-amber-600 text-stone-950 font-bold' : 'text-stone-400'}`}>عربي</button>
                <button onClick={() => setLang('en')} className={`px-2 py-0.5 rounded-full ${lang === 'en' ? 'bg-amber-600 text-stone-950 font-bold' : 'text-stone-400'}`}>EN</button>
              </div>

              {/* حساب المستخدم */}
              {user ? (
                <div className="flex items-center gap-2 bg-stone-900 px-3 py-1 rounded-full border border-stone-800 text-xs">
                  <img src={user.avatar} className="w-5 h-5 rounded-full" alt="" />
                  <span className="max-w-[80px] truncate">{user.name}</span>
                  <button onClick={() => { setUser(null); localStorage.removeItem('vayron_user'); }} className="text-rose-400 mr-1">
                    <i className="fa-solid fa-power-off"></i>
                  </button>
                </div>
              ) : (
                <button onClick={() => setShowGoogleModal(true)} className="bg-stone-900 border border-stone-700 text-stone-300 text-xs px-3 py-1.5 rounded-full flex items-center gap-2">
                  <i className="fa-brands fa-google text-amber-500"></i>
                  <span>{lang === 'ar' ? 'دخول Google' : 'Google Sign in'}</span>
                </button>
              )}
            </nav>
          </header>

          {/* محتوى الصفحة */}
          <main className="flex-1 max-w-6xl mx-auto px-6 py-10 w-full">
            {/* الرئيسية */}
            {view === 'home' && (
              <div className="space-y-16 py-6">
                <div className="text-center space-y-6 max-w-3xl mx-auto">
                  <span className="text-xs uppercase tracking-widest text-amber-500 border border-amber-500/20 bg-amber-950/20 px-4 py-1.5 rounded-full font-cinzel">
                    DIGITAL PUBLISHING HOUSE
                  </span>
                  <h2 className="text-4xl sm:text-6xl font-bold font-amiri leading-tight">
                    {lang === 'ar' ? 'حيث لا شيء كما يبدو في عتمة السطور' : 'Where nothing is what it seems beneath the shadow of words'}
                  </h2>
                  <p className="text-stone-400 text-base font-light">
                    {lang === 'ar' 
                      ? 'المنصة الرقمية المتخصصة في أدب الغموض، التحقيقات، وحبكات الإثارة النفسية المعاصرة.'
                      : 'The premier digital sanctum for contemporary mystery, psychological noir, and atmospheric fiction.'}
                  </p>
                  <div>
                    <button onClick={() => setView('books')} className="bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold px-8 py-3 rounded-xl shadow-lg transition">
                      {lang === 'ar' ? `استكشف المكتبة (${books.length})` : `Explore Library (${books.length})`}
                    </button>
                  </div>
                </div>

                {/* شرح الاسم */}
                <div className="bg-stone-900/60 border border-stone-800 rounded-3xl p-8 sm:p-10">
                  <h3 className="text-2xl font-bold font-cinzel text-amber-500 mb-3">VAYRON</h3>
                  <p className="text-stone-300 text-sm leading-relaxed">
                    {lang === 'ar'
                      ? 'فايرون (VAYRON) ليس مجرد علامة أدبية، بل هو الحد الفاصل بين الحقيقة والوهم. تم تأسيس الدار لتقديم أدب نفسي مكثف، حيث الغموض يغوص عميقاً في تعقيدات النفس البشرية وتناقضاتها.'
                      : 'VAYRON is not merely a publishing mark; it is the boundary dividing certainty from illusion, dedicated to deep psychological thrillers and atmospheric mystery.'}
                  </p>
                </div>
              </div>
            )}

            {/* المكتبة */}
            {view === 'books' && (
              <div className="space-y-8">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-stone-800 pb-4">
                  <h3 className="text-2xl font-bold text-stone-100 font-amiri">{lang === 'ar' ? 'المكتبة المنشورة' : 'Published Works'}</h3>
                  <div className="flex gap-1.5 flex-wrap text-xs">
                    <button onClick={() => setSelectedGenre('all')} className={`px-3 py-1.5 rounded-lg ${selectedGenre === 'all' ? 'bg-amber-600 text-stone-950 font-bold' : 'bg-stone-900 text-stone-400'}`}>
                      {lang === 'ar' ? 'الكل' : 'All'}
                    </button>
                    {GENRES.map(g => (
                      <button key={g.id} onClick={() => setSelectedGenre(g.id)} className={`px-3 py-1.5 rounded-lg ${selectedGenre === g.id ? 'bg-amber-600 text-stone-950 font-bold' : 'bg-stone-900 text-stone-400'}`}>
                        {lang === 'ar' ? g.labelAr : g.labelEn}
                      </button>
                    ))}
                  </div>
                </div>

                {filteredBooks.length === 0 ? (
                  <div className="text-center py-16 text-stone-500 text-sm bg-stone-900/30 rounded-2xl border border-stone-800">
                    {lang === 'ar' ? 'لا توجد روايات منشورة في هذا القسم حالياً.' : 'No books in this section yet.'}
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {filteredBooks.map(book => (
                      <div key={book.id} className="bg-stone-900/70 border border-stone-800 rounded-2xl overflow-hidden flex flex-col justify-between">
                        <div>
                          <img src={book.coverUrl} className="w-full h-56 object-cover" alt="" />
                          <div className="p-5 space-y-2">
                            <span className="text-[10px] bg-amber-950/60 text-amber-400 border border-amber-800/40 px-2 py-0.5 rounded-full font-sans">
                              {GENRES.find(g => g.id === book.genre)?.[lang === 'ar' ? 'labelAr' : 'labelEn'] || book.genre}
                            </span>
                            <h4 className="text-xl font-bold font-amiri text-stone-100">{lang === 'ar' ? (book.titleAr || book.titleEn) : (book.titleEn || book.titleAr)}</h4>
                            <p className="text-xs text-stone-400 line-clamp-3">{book.desc}</p>
                          </div>
                        </div>

                        <div className="p-5 pt-3 border-t border-stone-800/60 space-y-3">
                          <div className="flex justify-between items-center text-sm font-bold">
                            {book.isFree ? (
                              <span className="text-emerald-400">{lang === 'ar' ? 'مجانية' : 'Free'}</span>
                            ) : (
                              <span className="text-amber-400 font-mono">${book.price} USDT</span>
                            )}
                          </div>

                          {book.isFree ? (
                            <div className="grid grid-cols-2 gap-2 text-xs">
                              <button onClick={() => handleRead(book, 'ar')} className="bg-emerald-950/50 border border-emerald-600/40 text-emerald-300 py-2 rounded-lg hover:bg-emerald-600 hover:text-white transition">
                                قراءة (عربي)
                              </button>
                              <button onClick={() => handleRead(book, 'en')} className="bg-stone-900 border border-stone-700 text-stone-300 py-2 rounded-lg hover:bg-emerald-600 hover:text-white transition font-cinzel">
                                Read (EN)
                              </button>
                            </div>
                          ) : (
                            <div className="grid grid-cols-2 gap-2 text-xs">
                              <button onClick={() => handleBuy(book, 'ar')} className="bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold py-2 rounded-lg transition">
                                شراء (عربي)
                              </button>
                              <button onClick={() => handleBuy(book, 'en')} className="bg-stone-900 border border-amber-600/40 text-amber-400 hover:bg-amber-600 hover:text-stone-950 font-bold py-2 rounded-lg transition font-cinzel">
                                Buy (EN)
                              </button>
                            </div>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* صفحة الدفع */}
            {view === 'checkout' && checkoutData && (
              <div className="bg-stone-900 border border-stone-800 p-8 rounded-3xl max-w-lg mx-auto text-center space-y-6">
                <h3 className="text-2xl font-bold font-amiri text-stone-100">
                  {lang === 'ar' ? (checkoutData.book.titleAr || checkoutData.book.titleEn) : (checkoutData.book.titleEn || checkoutData.book.titleAr)}
                </h3>
                <div className="text-xs text-amber-400 bg-amber-950/40 border border-amber-800/40 px-3 py-1 rounded-full inline-block">
                  النسخة: {checkoutData.edition === 'ar' ? 'العربية' : 'English Edition'}
                </div>
                <p className="text-lg font-mono font-bold text-amber-400">${checkoutData.book.price} USDT</p>

                <div className="bg-white p-3 rounded-2xl inline-block mx-auto">
                  <img src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${WALLET_ADDRESS}`} className="w-44 h-44" alt="" />
                </div>

                <div className="bg-stone-950 p-4 rounded-xl border border-stone-800 text-right space-y-2">
                  <div className="flex justify-between text-xs text-stone-400">
                    <span>عنوان المحفظة (USDT):</span>
                    <span className="text-amber-500 font-semibold">{NETWORK}</span>
                  </div>
                  <div className="text-xs font-mono break-all text-amber-200 bg-stone-900 p-2 rounded border border-stone-800 select-all">
                    {WALLET_ADDRESS}
                  </div>
                  <button onClick={copyAddress} className="w-full bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold text-xs py-2 rounded transition">
                    {copied ? 'تم النسخ!' : 'نسخ عنوان المحفظة'}
                  </button>
                </div>

                <button onClick={() => setView('books')} className="text-xs text-stone-400 underline block mx-auto">
                  إلغاء والعودة
                </button>
              </div>
            )}

            {/* لوحة الإدارة */}
            {view === 'admin' && isAdmin && (
              <div className="space-y-8 text-right" dir="rtl">
                <div className="flex justify-between items-center border-b border-stone-800 pb-4">
                  <h3 className="text-xl font-bold text-amber-400">لوحة تحكم دار النشر</h3>
                  <button onClick={() => { setIsAdmin(false); setView('home'); }} className="text-xs text-rose-400 hover:underline">
                    تسجيل الخروج
                  </button>
                </div>

                {/* الإحصائيات */}
                <div className="grid grid-cols-3 gap-4">
                  <div className="bg-stone-900 p-4 rounded-xl border border-stone-800 text-center">
                    <p className="text-xs text-stone-400">الزيارات</p>
                    <h4 className="text-2xl font-bold text-amber-400 font-mono mt-1">{viewsCount}</h4>
                  </div>
                  <div className="bg-stone-900 p-4 rounded-xl border border-stone-800 text-center">
                    <p className="text-xs text-stone-400">المشتركين</p>
                    <h4 className="text-2xl font-bold text-emerald-400 font-mono mt-1">{subscribers.length}</h4>
                  </div>
                  <div className="bg-stone-900 p-4 rounded-xl border border-stone-800 text-center">
                    <p className="text-xs text-stone-400">الروايات</p>
                    <h4 className="text-2xl font-bold text-stone-200 font-mono mt-1">{books.length}</h4>
                  </div>
                </div>

                {/* نموذج النشر بالعربي الكامل */}
                <form onSubmit={handleAddBook} className="bg-stone-900 p-6 rounded-2xl border border-stone-800 space-y-4">
                  <div className="flex justify-between items-center">
                    <h4 className="font-bold text-stone-200">نشر رواية جديدة</h4>
                    <label className="flex items-center gap-2 text-xs text-stone-300">
                      <input type="checkbox" checked={newBook.isFree} onChange={e => setNewBook({...newBook, isFree: e.target.checked})} className="accent-emerald-500" />
                      <span>رواية مجانية</span>
                    </label>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="text-xs text-stone-400 block mb-1">اسم الرواية باللغة العربية</label>
                      <input required type="text" value={newBook.titleAr} onChange={e => setNewBook({...newBook, titleAr: e.target.value})} placeholder="مثال: الغرفة رقم 4" className="w-full bg-stone-950 border border-stone-800 p-2 rounded text-sm" />
                    </div>
                    <div>
                      <label className="text-xs text-stone-400 block mb-1">اسم الرواية باللغة الإنجليزية (English Title)</label>
                      <input type="text" value={newBook.titleEn} onChange={e => setNewBook({...newBook, titleEn: e.target.value})} placeholder="Room No. 4" className="w-full bg-stone-950 border border-stone-800 p-2 rounded text-sm text-left font-cinzel" />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-4">
                    <div>
                      <label className="text-xs text-stone-400 block mb-1">القسم والتصنيف</label>
                      <select value={newBook.genre} onChange={e => setNewBook({...newBook, genre: e.target.value})} className="w-full bg-stone-950 border border-stone-800 p-2 rounded text-sm">
                        {GENRES.map(g => <option key={g.id} value={g.id}>{g.labelAr}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-xs text-stone-400 block mb-1">السعر (بالدولار USDT)</label>
                      <input disabled={newBook.isFree} type="number" step="0.5" value={newBook.isFree ? '0.00' : newBook.price} onChange={e => setNewBook({...newBook, price: e.target.value})} className="w-full bg-stone-950 border border-stone-800 p-2 rounded text-sm" />
                    </div>
                    <div>
                      <label className="text-xs text-stone-400 block mb-1">رابط صورة الغلاف</label>
                      <input type="text" value={newBook.coverUrl} onChange={e => setNewBook({...newBook, coverUrl: e.target.value})} className="w-full bg-stone-950 border border-stone-800 p-2 rounded text-sm" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4 bg-stone-950 p-3 rounded-xl border border-stone-800">
                    <div>
                      <label className="text-xs text-amber-400 block mb-1 font-bold">رابط ملف الرواية باللغة العربية (PDF)</label>
                      <input type="url" value={newBook.pdfUrlAr} onChange={e => setNewBook({...newBook, pdfUrlAr: e.target.value})} placeholder="رابط Google Drive للنسخة العربية" className="w-full bg-stone-900 border border-stone-800 p-2 rounded text-xs text-left" />
                    </div>
                    <div>
                      <label className="text-xs text-amber-400 block mb-1 font-bold">رابط ملف الرواية باللغة الإنجليزية (PDF)</label>
                      <input type="url" value={newBook.pdfUrlEn} onChange={e => setNewBook({...newBook, pdfUrlEn: e.target.value})} placeholder="Drive link for English PDF" className="w-full bg-stone-900 border border-stone-800 p-2 rounded text-xs text-left" />
                    </div>
                  </div>

                  <div>
                    <label className="text-xs text-stone-400 block mb-1">النبذة التشويقية</label>
                    <textarea rows="2" value={newBook.desc} onChange={e => setNewBook({...newBook, desc: e.target.value})} placeholder="وصف الرواية..." className="w-full bg-stone-950 border border-stone-800 p-2 rounded text-sm"></textarea>
                  </div>

                  <button type="submit" className="w-full bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold py-2.5 rounded-xl transition">
                    نشر الرواية فوراً
                  </button>
                </form>

                {/* حذف الروايات */}
                <div className="space-y-2">
                  <h4 className="text-sm font-bold text-stone-400">الروايات المنشورة ({books.length})</h4>
                  {books.map(b => (
                    <div key={b.id} className="bg-stone-900 p-3 rounded-lg border border-stone-800 flex justify-between items-center text-xs">
                      <span>{b.titleAr || b.titleEn}</span>
                      <button onClick={() => handleDeleteBook(b.id)} className="text-rose-400 hover:underline">حذف</button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* نافذة تسجيل الدخول للزبائن */}
          {showGoogleModal && (
            <div className="fixed inset-0 bg-stone-950/90 backdrop-blur z-50 flex items-center justify-center p-4">
              <div className="bg-stone-900 border border-stone-800 max-w-sm w-full p-6 rounded-2xl text-center space-y-4">
                <i className="fa-brands fa-google text-2xl text-amber-500"></i>
                <h3 className="text-lg font-bold">تسجيل الدخول للمتابعة</h3>
                <form onSubmit={handleLoginSubmit} className="space-y-3 text-right">
                  <input required type="text" placeholder="الاسم" value={inputName} onChange={e => setInputName(e.target.value)} className="w-full bg-stone-950 border border-stone-800 p-2 rounded text-xs" />
                  <input required type="email" placeholder="البريد الإلكتروني" value={inputEmail} onChange={e => setInputEmail(e.target.value)} className="w-full bg-stone-950 border border-stone-800 p-2 rounded text-xs text-left" />
                  <button type="submit" className="w-full bg-amber-600 font-bold text-stone-950 py-2 rounded text-xs">تأكيد ومتابعة</button>
                </form>
                <button onClick={() => setShowGoogleModal(false)} className="text-xs text-stone-500">إلغاء</button>
              </div>
            </div>
          )}

          {/* نافذة الدخول السري (Ctrl + Shift + A) */}
          {showSecretModal && (
            <div className="fixed inset-0 bg-stone-950/95 z-50 flex items-center justify-center p-4">
              <div className="bg-stone-900 border border-stone-700 max-w-sm w-full p-6 rounded-2xl text-center space-y-4">
                <i className="fa-solid fa-key text-amber-500 text-xl"></i>
                <h3 className="font-bold font-cinzel text-stone-100">RESTRICTED ACCESS</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  if (adminPass === ADMIN_KEY) {
                    setIsAdmin(true);
                    setShowSecretModal(false);
                    setAdminPass('');
                    setAdminError(false);
                    setView('admin');
                  } else {
                    setAdminError(true);
                  }
                }} className="space-y-3">
                  <input type="password" placeholder="مفتاح الأمان السري..." value={adminPass} onChange={e => setAdminPass(e.target.value)} className="w-full bg-stone-950 border border-stone-700 p-2 rounded text-xs text-center text-amber-400 font-mono" />
                  {adminError && <p className="text-xs text-rose-500">المفتاح غير صالح!</p>}
                  <button type="submit" className="w-full bg-amber-600 font-bold text-stone-950 py-2 rounded text-xs">دخول</button>
                </form>
                <button onClick={() => setShowSecretModal(false)} className="text-xs text-stone-500">إلغاء</button>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-stone-900 py-6 text-center text-xs text-stone-500">
            <p className="font-cinzel tracking-wider text-stone-400">VAYRON PUBLISHING HOUSE</p>
            <p>© 2026 دار فايرون للنشر الرقمي. {OFFICIAL_EMAIL}</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
