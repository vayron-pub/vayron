<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VAYRON | دار فايرون للنشر الرقمي</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- خطوط راقية -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Amiri', serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }
  </style>
</head>
<body class="bg-stone-950 text-stone-100 antialiased selection:bg-amber-900 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const WALLET_ADDRESS = "TJQ5vYmcmfXtp7L4SAtgGnL9onLkDLm6Q6";
    const NETWORK = "TRON (TRC20)";

    // الأقسام الأدبية المعتمدة
    const GENRES = [
      { id: 'psychological', labelAr: 'إثارة نفسية', labelEn: 'Psychological' },
      { id: 'mystery', labelAr: 'غموض وتحقيقات', labelEn: 'Mystery' },
      { id: 'horror', labelAr: 'رعب وما وراء الطبيعة', labelEn: 'Horror' },
      { id: 'suspense', labelAr: 'تشويق وحبس أنفاس', labelEn: 'Suspense' },
      { id: 'short_stories', labelAr: 'قصص قصيرة', labelEn: 'Short Stories' },
      { id: 'scifi', labelAr: 'خيال علمي مظلم', labelEn: 'Dark Sci-Fi' }
    ];

    function getGenreLabel(genreId) {
      const g = GENRES.find(item => item.id === genreId);
      return g ? g.labelAr : 'غموض وإثارة';
    }

    function App() {
      const [view, setView] = React.useState('home');
      const [copied, setCopied] = React.useState(false);
      const [isAdmin, setIsAdmin] = React.useState(false);
      const [adminPassword, setAdminPassword] = React.useState('');
      const [authError, setAuthError] = React.useState(false);

      // الروايات المحفوظة في المتصفح
      const [books, setBooks] = React.useState(() => {
        const saved = localStorage.getItem('vayron_books');
        return saved ? JSON.parse(saved) : [];
      });

      const [selectedGenre, setSelectedGenre] = React.useState('all');
      const [activeBookForPay, setActiveBookForPay] = React.useState(null);

      // نموذج إضافة رواية
      const [newBook, setNewBook] = React.useState({
        titleAr: '',
        titleEn: '',
        author: 'هيئة تحرير VAYRON',
        genre: 'psychological',
        price: '4.99',
        isFree: false,
        desc: '',
        coverUrl: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80',
        pdfUrl: ''
      });

      const saveBooksToStorage = (updated) => {
        setBooks(updated);
        localStorage.setItem('vayron_books', JSON.stringify(updated));
      };

      const copyAddress = () => {
        navigator.clipboard.writeText(WALLET_ADDRESS);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (adminPassword === 'admin123') {
          setIsAdmin(true);
          setView('admin');
          setAuthError(false);
        } else {
          setAuthError(true);
        }
      };

      const handleAddBook = (e) => {
        e.preventDefault();
        if (!newBook.titleAr) return;
        const bookToAdd = {
          ...newBook,
          id: Date.now(),
          price: newBook.isFree ? '0.00' : newBook.price
        };
        const updated = [bookToAdd, ...books];
        saveBooksToStorage(updated);
        alert('تم نشر الرواية بنجاح في المكتبة!');
        setNewBook({
          titleAr: '',
          titleEn: '',
          author: 'هيئة تحرير VAYRON',
          genre: 'psychological',
          price: '4.99',
          isFree: false,
          desc: '',
          coverUrl: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80',
          pdfUrl: ''
        });
        setView('books');
      };

      const handleDeleteBook = (id) => {
        if (confirm('هل أنت متأكد من حذف هذه الرواية من المتجر؟')) {
          const updated = books.filter(b => b.id !== id);
          saveBooksToStorage(updated);
        }
      };

      // فلترة الكتب حسب القسم فقط (الروايات المجانية تظهر داخل قسمها تلقائياً)
      const filteredBooks = selectedGenre === 'all' 
        ? books 
        : books.filter(b => b.genre === selectedGenre);

      return (
        <div className="min-h-screen flex flex-col justify-between">
          {/* Header */}
          <header className="border-b border-stone-800 bg-stone-900/60 backdrop-blur sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('home')}>
              <h1 className="text-3xl font-cinzel tracking-widest text-amber-500 font-bold">VAYRON</h1>
              <span className="text-xs text-stone-500 border-r border-stone-700 pr-3 hidden sm:inline">NOTHING IS WHAT IT SEEMS</span>
            </div>
            <nav className="flex items-center gap-6 text-sm font-medium">
              <button 
                onClick={() => setView('home')} 
                className={`transition ${view === 'home' ? 'text-amber-400 font-bold' : 'text-stone-300 hover:text-amber-400'}`}
              >
                الرئيسية
              </button>
              <button 
                onClick={() => setView('books')} 
                className={`transition ${view === 'books' ? 'text-amber-400 font-bold' : 'text-stone-300 hover:text-amber-400'}`}
              >
                المكتبة ({books.length})
              </button>
              {isAdmin && (
                <button 
                  onClick={() => setView('admin')} 
                  className="text-amber-400 bg-amber-950/40 border border-amber-600/30 px-3 py-1 rounded text-xs"
                >
                  <i className="fa-solid fa-lock-open ml-1"></i> لوحة التحكم
                </button>
              )}
            </nav>
          </header>

          {/* Main Content */}
          <main className="flex-1 max-w-6xl mx-auto px-6 py-10 w-full">
            {/* الصفحة الرئيسية: نقية وبسيطة بدون أي إشارة للمجاني أو وسائل الدفع */}
            {view === 'home' && (
              <div className="text-center space-y-8 my-10">
                <span className="text-xs uppercase tracking-widest text-amber-500 border border-amber-500/30 px-4 py-1.5 rounded-full">
                  دار النشر الرقمي الفاخرة للغموض والإثارة
                </span>
                <h2 className="text-4xl md:text-6xl font-bold leading-tight max-w-3xl mx-auto">
                  حيث لا شيء كما يبدو في عتمة السطور
                </h2>
                <p className="text-stone-400 text-lg max-w-2xl mx-auto leading-relaxed">
                  منصة VAYRON المتخصصة في أدب الغموض، التحقيقات، الرعب، والإثارة النفسية المعاصرة. تجربة قراءة رقمية مشوقة ومباشرة.
                </p>
                <div className="pt-4">
                  <button 
                    onClick={() => { setSelectedGenre('all'); setView('books'); }} 
                    className="bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold px-8 py-3.5 rounded-lg shadow-lg shadow-amber-900/30 transition text-base"
                  >
                    استكشف المكتبة ({books.length})
                  </button>
                </div>
              </div>
            )}

            {/* صفحة المكتبة: التصنيفات الأدبية فقط */}
            {view === 'books' && (
              <div className="space-y-8">
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-stone-800 pb-4">
                  <h3 className="text-2xl font-bold text-amber-400">مكتبة الروايات</h3>
                  
                  {/* أزرار الأقسام الأدبية فقط */}
                  <div className="flex gap-1.5 text-xs flex-wrap items-center">
                    <button 
                      onClick={() => setSelectedGenre('all')} 
                      className={`px-3 py-1.5 rounded transition ${selectedGenre === 'all' ? 'bg-amber-600 text-stone-950 font-bold' : 'bg-stone-900 text-stone-400 hover:text-stone-200'}`}
                    >
                      الكل
                    </button>
                    {GENRES.map(g => (
                      <button 
                        key={g.id}
                        onClick={() => setSelectedGenre(g.id)} 
                        className={`px-3 py-1.5 rounded transition ${selectedGenre === g.id ? 'bg-amber-600 text-stone-950 font-bold' : 'bg-stone-900 text-stone-400 hover:text-stone-200'}`}
                      >
                        {g.labelAr}
                      </button>
                    ))}
                  </div>
                </div>

                {filteredBooks.length === 0 ? (
                  <div className="bg-stone-900/40 border border-stone-800/80 rounded-2xl p-12 text-center space-y-4">
                    <i className="fa-solid fa-feather-pointed text-4xl text-amber-500/60 mb-2"></i>
                    <h4 className="text-xl font-bold">لا توجد روايات معروضة في هذا القسم حالياً</h4>
                    <p className="text-stone-400 max-w-md mx-auto text-sm">
                      يمكنك الدخول من أسفل الصفحة إلى هيئة التحرير لإضافة ونشر الروايات.
                    </p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {filteredBooks.map(book => (
                      <div key={book.id} className="bg-stone-900 border border-stone-800 rounded-xl overflow-hidden flex flex-col justify-between group hover:border-amber-500/40 transition">
                        <div>
                          <div className="relative">
                            <img src={book.coverUrl} alt={book.titleAr} className="w-full h-60 object-cover" />
                            {book.isFree && (
                              <span className="absolute top-3 left-3 bg-emerald-600 text-white text-[10px] font-bold px-2.5 py-1 rounded shadow-lg uppercase tracking-wider">
                                مجاناً / Free
                              </span>
                            )}
                          </div>
                          <div className="p-5 space-y-2">
                            <span className="text-[10px] bg-amber-950/60 text-amber-400 border border-amber-800/40 px-2.5 py-0.5 rounded-full font-sans">
                              {getGenreLabel(book.genre)}
                            </span>
                            <h4 className="text-xl font-bold text-stone-100 group-hover:text-amber-400 transition">{book.titleAr}</h4>
                            <p className="text-xs text-stone-400 font-cinzel">{book.titleEn}</p>
                            <p className="text-stone-400 text-sm line-clamp-3 mt-2 leading-relaxed">{book.desc}</p>
                          </div>
                        </div>
                        <div className="p-5 pt-0 border-t border-stone-800/60 mt-4 flex justify-between items-center">
                          {book.isFree ? (
                            <span className="text-base font-bold text-emerald-400 flex items-center gap-1">
                              <i className="fa-solid fa-check-circle text-xs"></i>
                              <span>إصدار مجاني</span>
                            </span>
                          ) : (
                            <span className="text-lg font-bold text-amber-400">${book.price} USDT</span>
                          )}

                          {/* زر التفاعل: إذا مجاني يفتح الرواية، وإذا مدفوع يفتح الدفع */}
                          {book.isFree ? (
                            <a 
                              href={book.pdfUrl || '#'} 
                              target="_blank" 
                              rel="noopener noreferrer"
                              className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-2.5 rounded transition flex items-center gap-1.5"
                            >
                              <i className="fa-solid fa-book-open"></i>
                              <span>قراءة مجانية</span>
                            </a>
                          ) : (
                            <button 
                              onClick={() => { setActiveBookForPay(book); setView('checkout'); }}
                              className="bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold text-xs px-4 py-2.5 rounded transition flex items-center gap-1.5"
                            >
                              <i className="fa-solid fa-cart-shopping"></i>
                              <span>شراء الرواية</span>
                            </button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* نافذة الدفع للروايات المدفوعة فقط */}
            {view === 'checkout' && activeBookForPay && (
              <div className="bg-stone-900 border border-stone-800 p-8 rounded-2xl max-w-lg mx-auto shadow-2xl text-center space-y-6">
                <div>
                  <span className="text-xs text-amber-500 uppercase tracking-widest border border-amber-500/20 px-3 py-1 rounded-full">فاتورة طلب رواية</span>
                  <h3 className="text-2xl font-bold text-stone-100 mt-3">{activeBookForPay.titleAr}</h3>
                  <p className="text-sm text-stone-400 mt-1 font-mono">
                    المبلغ المطلوب: <span className="text-amber-400 font-bold text-lg">${activeBookForPay.price} USDT</span>
                  </p>
                </div>

                <div className="border-t border-stone-800 pt-4 text-xs text-stone-400">
                  يرجى تحويل المبلغ بدقة عبر شبكة <span className="text-stone-200 font-bold">{NETWORK}</span> إلى المحفظة الرسمية:
                </div>
                
                {/* QR Code */}
                <div className="bg-white p-3 rounded-xl inline-block shadow-inner mx-auto">
                  <img 
                    src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${WALLET_ADDRESS}`} 
                    alt="USDT TRC20 QR Code" 
                    className="w-48 h-48"
                  />
                </div>

                {/* تفاصيل المحفظة */}
                <div className="bg-stone-950 border border-stone-800 p-4 rounded-lg text-right space-y-2">
                  <div className="flex justify-between items-center text-xs text-stone-400">
                    <span>عنوان المحفظة (USDT):</span>
                    <span className="text-amber-500 font-semibold">{NETWORK}</span>
                  </div>
                  <div className="font-mono text-xs break-all text-amber-200 select-all p-2.5 bg-stone-900 rounded border border-stone-800">
                    {WALLET_ADDRESS}
                  </div>
                  <button 
                    onClick={copyAddress}
                    className="w-full mt-2 bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold text-xs py-2.5 rounded transition flex items-center justify-center gap-2"
                  >
                    <i className="fa-regular fa-copy"></i>
                    {copied ? "تم النسخ بنجاح!" : "نسخ عنوان المحفظة"}
                  </button>
                </div>

                <button 
                  onClick={() => setView('books')} 
                  className="text-xs text-stone-400 hover:text-stone-200 underline block mx-auto pt-2"
                >
                  إلغاء والعودة إلى المكتبة
                </button>
              </div>
            )}

            {/* تسجيل دخول الإدارة */}
            {view === 'login' && !isAdmin && (
              <div className="bg-stone-900 border border-stone-800 p-8 rounded-2xl max-w-md mx-auto shadow-2xl text-center space-y-5">
                <i className="fa-solid fa-lock text-3xl text-amber-500"></i>
                <h3 className="text-xl font-bold text-stone-200">دخول هيئة التحرير (الأدمن)</h3>
                <form onSubmit={handleLogin} className="space-y-4">
                  <input 
                    type="password" 
                    placeholder="أدخل كلمة مرور الإدارة..." 
                    value={adminPassword}
                    onChange={(e) => setAdminPassword(e.target.value)}
                    className="w-full bg-stone-950 border border-stone-700 px-4 py-2.5 rounded text-sm text-center focus:border-amber-500 focus:outline-none"
                  />
                  {authError && <p className="text-xs text-rose-500">كلمة المرور غير صحيحة!</p>}
                  <button type="submit" className="w-full bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold py-2.5 rounded transition">
                    تسجيل الدخول
                  </button>
                </form>
              </div>
            )}

            {/* لوحة تحكم الإدارة الكاملة */}
            {view === 'admin' && isAdmin && (
              <div className="space-y-10">
                <div className="flex justify-between items-center border-b border-stone-800 pb-4">
                  <div>
                    <h3 className="text-2xl font-bold text-amber-400">لوحة تحكم دار النشر</h3>
                    <p className="text-xs text-stone-400">إضافة وتصنيف الروايات (المجانية والمدفوعة داخل الأقسام)</p>
                  </div>
                  <button onClick={() => { setIsAdmin(false); setView('home'); }} className="text-xs text-rose-400 hover:underline">
                    تسجيل الخروج
                  </button>
                </div>

                {/* نموذج إضافة رواية */}
                <form onSubmit={handleAddBook} className="bg-stone-900 border border-stone-800 p-6 rounded-2xl space-y-4">
                  <div className="flex justify-between items-center">
                    <h4 className="text-lg font-bold text-stone-200">إضافة رواية جديدة</h4>
                    
                    {/* خيار الرواية المجانية داخل القسم */}
                    <label className="flex items-center gap-2 cursor-pointer bg-stone-950 px-3 py-1.5 rounded-lg border border-stone-800 select-none">
                      <input 
                        type="checkbox" 
                        checked={newBook.isFree}
                        onChange={e => setNewBook({...newBook, isFree: e.target.checked})}
                        className="w-4 h-4 accent-emerald-500 cursor-pointer"
                      />
                      <span className={`text-xs font-bold ${newBook.isFree ? 'text-emerald-400' : 'text-stone-400'}`}>
                        إصدار مجاني (Free)
                      </span>
                    </label>
                  </div>
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="text-xs text-stone-400 block mb-1">عنوان الرواية (بالعربي)</label>
                      <input 
                        required
                        type="text" 
                        value={newBook.titleAr} 
                        onChange={e => setNewBook({...newBook, titleAr: e.target.value})}
                        placeholder="مثال: الغرفة رقم 4" 
                        className="w-full bg-stone-950 border border-stone-800 px-3 py-2 rounded text-sm"
                      />
                    </div>
                    <div>
                      <label className="text-xs text-stone-400 block mb-1">العنوان بالإنجليزية (English Title)</label>
                      <input 
                        type="text" 
                        value={newBook.titleEn} 
                        onChange={e => setNewBook({...newBook, titleEn: e.target.value})}
                        placeholder="e.g. Room No. 4" 
                        className="w-full bg-stone-950 border border-stone-800 px-3 py-2 rounded text-sm text-left"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                      <label className="text-xs text-stone-400 block mb-1">التصنيف / القسم</label>
                      <select 
                        value={newBook.genre} 
                        onChange={e => setNewBook({...newBook, genre: e.target.value})}
                        className="w-full bg-stone-950 border border-stone-800 px-3 py-2 rounded text-sm text-stone-200"
                      >
                        {GENRES.map(g => (
                          <option key={g.id} value={g.id}>{g.labelAr} ({g.labelEn})</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="text-xs text-stone-400 block mb-1">السعر (بالدولار USDT)</label>
                      <input 
                        disabled={newBook.isFree}
                        type="number" 
                        step="0.5"
                        value={newBook.isFree ? '0.00' : newBook.price} 
                        onChange={e => setNewBook({...newBook, price: e.target.value})}
                        className={`w-full bg-stone-950 border border-stone-800 px-3 py-2 rounded text-sm ${newBook.isFree ? 'text-emerald-500 opacity-60 cursor-not-allowed' : ''}`}
                      />
                    </div>

                    <div>
                      <label className="text-xs text-stone-400 block mb-1">رابط صورة الغلاف</label>
                      <input 
                        type="text" 
                        value={newBook.coverUrl} 
                        onChange={e => setNewBook({...newBook, coverUrl: e.target.value})}
                        placeholder="رابط مباشر لصورة الغلاف" 
                        className="w-full bg-stone-950 border border-stone-800 px-3 py-2 rounded text-sm"
                      />
                    </div>
                  </div>

                  {/* رابط ملف الرواية */}
                  <div>
                    <label className="text-xs text-stone-400 block mb-1">
                      رابط ملف الرواية (PDF أو قراءة مباشرة) 
                      {newBook.isFree && <span className="text-emerald-400 mr-1">*(يفتح مباشرة للقارئ دون دفع)*</span>}
                    </label>
                    <input 
                      type="url" 
                      value={newBook.pdfUrl} 
                      onChange={e => setNewBook({...newBook, pdfUrl: e.target.value})}
                      placeholder="https://example.com/novel.pdf أو رابط Google Drive" 
                      className="w-full bg-stone-950 border border-stone-800 px-3 py-2 rounded text-sm text-left"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-stone-400 block mb-1">النبذة التشويقية (الخلاصة)</label>
                    <textarea 
                      rows="3" 
                      value={newBook.desc} 
                      onChange={e => setNewBook({...newBook, desc: e.target.value})}
                      placeholder="اكتب نبذة غامضة تحبس الأنفاس وتشجع على القراءة..." 
                      className="w-full bg-stone-950 border border-stone-800 px-3 py-2 rounded text-sm"
                    ></textarea>
                  </div>

                  <button type="submit" className="w-full bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold py-3 rounded-lg transition">
                    نشر الرواية فوراً في المكتبة
                  </button>
                </form>

                {/* قائمة الروايات المنشورة */}
                <div className="space-y-4">
                  <h4 className="text-lg font-bold text-stone-300">الروايات المنشورة حالياً ({books.length})</h4>
                  {books.length === 0 ? (
                    <p className="text-xs text-stone-500">لم تقم بنشر أي رواية بعد.</p>
                  ) : (
                    <div className="space-y-2">
                      {books.map(b => (
                        <div key={b.id} className="bg-stone-900 border border-stone-800 p-4 rounded-lg flex justify-between items-center">
                          <div className="flex items-center gap-2">
                            <span className="font-bold text-stone-200">{b.titleAr}</span>
                            <span className="text-xs text-amber-500 font-mono">[{getGenreLabel(b.genre)}]</span>
                            {b.isFree ? (
                              <span className="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800/40 px-2 py-0.5 rounded">مجانية</span>
                            ) : (
                              <span className="text-xs text-stone-500 font-mono">(${b.price} USDT)</span>
                            )}
                          </div>
                          <button onClick={() => handleDeleteBook(b.id)} className="text-rose-500 text-xs hover:underline">
                            حذف الرواية
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="border-t border-stone-900 py-6 px-6 text-center text-xs text-stone-500 flex flex-col sm:flex-row justify-between items-center gap-4">
            <p>© 2026 VAYRON Publishing House. جميع الحقوق محفوظة.</p>
            <div>
              <button 
                onClick={() => setView('login')} 
                className="text-stone-600 hover:text-amber-500 transition text-[11px] underline"
              >
                دخول هيئة التحرير (لوحة التحكم)
              </button>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
