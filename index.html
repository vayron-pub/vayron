<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VAYRON | دار فايرون للنشر الرقمي</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- خطوط عربية وأجنبية راقية -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Amiri', serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }
  </style>
</head>
<body class="bg-stone-950 text-stone-100 antialiased selection:bg-amber-900 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const WALLET_ADDRESS = "TJQ5vYmcmfXtp7L4SAtgGnL9onLkDLm6Q6";
    const NETWORK = "TRON (TRC20)";

    function App() {
      const [view, setView] = React.useState('home');
      const [copied, setCopied] = React.useState(false);
      const [selectedGenre, setSelectedGenre] = React.useState('all');

      const copyAddress = () => {
        navigator.clipboard.writeText(WALLET_ADDRESS);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          {/* Header */}
          <header className="border-b border-stone-800 bg-stone-900/60 backdrop-blur sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('home')}>
              <h1 className="text-3xl font-cinzel tracking-widest text-amber-500 font-bold">VAYRON</h1>
              <span className="text-xs text-stone-500 border-r border-stone-700 pr-3 hidden sm:inline">NOTHING IS WHAT IT SEEMS</span>
            </div>
            <nav className="flex items-center gap-6 text-sm font-medium">
              <button onClick={() => setView('home')} className="hover:text-amber-400 transition">الرئيسية</button>
              <button onClick={() => setView('books')} className="hover:text-amber-400 transition">المكتبة</button>
              <button onClick={() => setView('checkout')} className="bg-amber-600/20 text-amber-400 border border-amber-600/40 px-3 py-1.5 rounded hover:bg-amber-600 hover:text-stone-950 transition">
                الدفع عبر Binance
              </button>
            </nav>
          </header>

          {/* Main Content */}
          <main className="flex-1 max-w-5xl mx-auto px-6 py-12 w-full">
            {view === 'home' && (
              <div className="text-center space-y-8 my-10">
                <span className="text-xs uppercase tracking-widest text-amber-500 border border-amber-500/30 px-4 py-1.5 rounded-full">
                  دار النشر الرقمي الفاخرة للغموض والإثارة
                </span>
                <h2 className="text-4xl md:text-6xl font-bold leading-tight max-w-3xl mx-auto">
                  حيث لا شيء كما يبدو في عتمة السطور
                </h2>
                <p className="text-stone-400 text-lg max-w-2xl mx-auto leading-relaxed">
                  منصة VAYRON المتخصصة في أدب الغموض، التحقيقات، والإثارة النفسية المعاصرة. تجربة قراءة رقمية مشوقة ومباشرة.
                </p>
                <div className="flex justify-center gap-4 pt-4">
                  <button onClick={() => setView('books')} className="bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold px-8 py-3.5 rounded-lg shadow-lg shadow-amber-900/30 transition">
                    استكشف المكتبة
                  </button>
                  <button onClick={() => setView('checkout')} className="bg-stone-900 hover:bg-stone-800 border border-stone-700 text-stone-300 px-6 py-3.5 rounded-lg transition">
                    طريقة الدفع (USDT)
                  </button>
                </div>
              </div>
            )}

            {view === 'books' && (
              <div className="space-y-8">
                <div className="flex justify-between items-center border-b border-stone-800 pb-4">
                  <h3 className="text-2xl font-bold text-amber-400">مكتبة الروايات</h3>
                  <div className="flex gap-2 text-xs">
                    <button onClick={() => setSelectedGenre('all')} className={`px-3 py-1.5 rounded ${selectedGenre === 'all' ? 'bg-amber-600 text-stone-950 font-bold' : 'bg-stone-900 text-stone-400'}`}>الكل</button>
                    <button onClick={() => setSelectedGenre('psychological')} className={`px-3 py-1.5 rounded ${selectedGenre === 'psychological' ? 'bg-amber-600 text-stone-950 font-bold' : 'bg-stone-900 text-stone-400'}`}>إثارة نفسية</button>
                    <button onClick={() => setSelectedGenre('mystery')} className={`px-3 py-1.5 rounded ${selectedGenre === 'mystery' ? 'bg-amber-600 text-stone-950 font-bold' : 'bg-stone-900 text-stone-400'}`}>غموض وألغاز</button>
                  </div>
                </div>

                <div className="bg-stone-900/40 border border-stone-800/80 rounded-2xl p-12 text-center space-y-4">
                  <i className="fa-solid fa-feather-pointed text-4xl text-amber-500/60 mb-2"></i>
                  <h4 className="text-xl font-bold">جاري إعداد أولى إصدارات الدار الحصرية</h4>
                  <p className="text-stone-400 max-w-md mx-auto text-sm">
                    نقوم حالياً بمراجعة الروايات المشوقة عبر هيئة التحرير لنشرها تباعاً.
                  </p>
                </div>
              </div>
            )}

            {view === 'checkout' && (
              <div className="bg-stone-900 border border-stone-800 p-8 rounded-2xl max-w-lg mx-auto shadow-2xl text-center space-y-6">
                <div>
                  <h3 className="text-2xl font-bold text-amber-400">الدفع المباشر عبر بايننس</h3>
                  <p className="text-xs text-stone-400 mt-1">Binance / Crypto Direct Payout</p>
                </div>

                <p className="text-sm text-stone-300">
                  يتم إرسال قيمة الرواية بالـ USDT عبر شبكة <span className="text-amber-400 font-bold">{NETWORK}</span> إلى المحفظة الرسمية:
                </p>
                
                {/* QR Code */}
                <div className="bg-white p-3 rounded-xl inline-block shadow-inner mx-auto">
                  <img 
                    src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${WALLET_ADDRESS}`} 
                    alt="USDT TRC20 QR Code" 
                    className="w-48 h-48"
                  />
                </div>

                {/* Wallet Info Box */}
                <div className="bg-stone-950 border border-stone-800 p-4 rounded-lg text-right space-y-2">
                  <div className="flex justify-between items-center text-xs text-stone-400">
                    <span>عنوان المحفظة المعتمد:</span>
                    <span className="text-amber-500 font-semibold">{NETWORK}</span>
                  </div>
                  <div className="font-mono text-xs break-all text-amber-200 select-all p-2.5 bg-stone-900 rounded border border-stone-800">
                    {WALLET_ADDRESS}
                  </div>
                  <button 
                    onClick={copyAddress}
                    className="w-full mt-2 bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold text-xs py-2.5 rounded transition flex items-center justify-center gap-2"
                  >
                    <i className="fa-regular fa-copy"></i>
                    {copied ? "تم النسخ بنجاح!" : "نسخ عنوان المحفظة"}
                  </button>
                </div>

                <div className="text-xs text-stone-500">
                  أرسل فقط أصول شبكة TRON (TRC20) إلى هذا العنوان.
                </div>

                <button onClick={() => setView('home')} className="text-xs text-stone-400 hover:text-stone-200 underline block mx-auto">
                  الرجوع للرئيسية
                </button>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="border-t border-stone-900 py-6 text-center text-xs text-stone-500">
            <p>© 2026 VAYRON Publishing House. جميع الحقوق محفوظة.</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
