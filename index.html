<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VAYRON | دار فايرون للنشر الرقمي</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- خطوط راقية -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;700;900&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .font-amiri { font-family: 'Amiri', serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }
  </style>
</head>
<body class="bg-[#0c0a09] text-stone-200 antialiased selection:bg-amber-600 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const WALLET_ADDRESS = "TJQ5vYmcmfXtp7L4SAtgGnL9onLkDLm6Q6";
    const NETWORK = "TRON (TRC20)";
    const ADMIN_SECRET_KEY = "V@yR0n#9921_X!";
    const OFFICIAL_EMAIL = "contact@vayron.pub";

    const GENRES = [
      { id: 'psychological', labelAr: 'إثارة نفسية', labelEn: 'Psychological' },
      { id: 'mystery', labelAr: 'غموض وتحقيقات', labelEn: 'Mystery' },
      { id: 'horror', labelAr: 'رعب وما وراء الطبيعة', labelEn: 'Horror' },
      { id: 'suspense', labelAr: 'تشويق وحبس أنفاس', labelEn: 'Suspense' },
      { id: 'short_stories', labelAr: 'قصص قصيرة', labelEn: 'Short Stories' },
      { id: 'scifi', labelAr: 'خيال علمي مظلم', labelEn: 'Dark Sci-Fi' }
    ];

    function getGenreLabel(genreId) {
      const g = GENRES.find(item => item.id === genreId);
      return g ? g.labelAr : 'غموض وإثارة';
    }

    function App() {
      const [view, setView] = React.useState('home');
      const [copied, setCopied] = React.useState(false);
      const [isAdmin, setIsAdmin] = React.useState(false);
      const [showSecretModal, setShowSecretModal] = React.useState(false);
      const [adminInputPass, setAdminInputPass] = React.useState('');
      const [adminError, setAdminError] = React.useState(false);

      // عداد الزيارات
      const [visitorsCount, setVisitorsCount] = React.useState(() => {
        const count = localStorage.getItem('vayron_views_count');
        return count ? parseInt(count, 10) : 1;
      });

      // قائمة المشتركين المسجلين
      const [subscribers, setSubscribers] = React.useState(() => {
        const list = localStorage.getItem('vayron_subscribers_list');
        return list ? JSON.parse(list) : [];
      });

      // بيانات الزبون الحالي
      const [user, setUser] = React.useState(() => {
        const saved = localStorage.getItem('vayron_customer_user');
        return saved ? JSON.parse(saved) : null;
      });

      const [showUserMenu, setShowUserMenu] = React.useState(false);
      const [showGoogleModal, setShowGoogleModal] = React.useState(false);
      const [loginReasonMsg, setLoginReasonMsg] = React.useState('');
      const [pendingAction, setPendingAction] = React.useState(null);

      // حقول تسجيل الدخول
      const [inputEmail, setInputEmail] = React.useState('');
      const [inputName, setInputName] = React.useState('');

      // الروايات
      const [books, setBooks] = React.useState(() => {
        const saved = localStorage.getItem('vayron_books');
        return saved ? JSON.parse(saved) : [];
      });

      const [selectedGenre, setSelectedGenre] = React.useState('all');
      const [activeBookForPay, setActiveBookForPay] = React.useState(null);

      // نموذج كتاب جديد
      const [newBook, setNewBook] = React.useState({
        titleAr: '',
        titleEn: '',
        genre: 'psychological',
        price: '4.99',
        isFree: false,
        desc: '',
        coverUrl: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80',
        pdfUrl: ''
      });

      // احتساب الزيارات بالجلسة
      React.useEffect(() => {
        const sessionCounted = sessionStorage.getItem('vayron_session_counted');
        if (!sessionCounted) {
          const newTotal = visitorsCount + 1;
          setVisitorsCount(newTotal);
          localStorage.setItem('vayron_views_count', newTotal.toString());
          sessionStorage.setItem('vayron_session_counted', 'true');
        }
      }, []);

      // اختصار المفاتيح السري للإدارة Ctrl + Shift + A
      React.useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
            e.preventDefault();
            setShowSecretModal(true);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // النقر 3 مرات على اللوغو
      const logoClicksRef = React.useRef(0);
      const handleLogoSecretClick = () => {
        logoClicksRef.current += 1;
        if (logoClicksRef.current >= 3) {
          setShowSecretModal(true);
          logoClicksRef.current = 0;
        }
        setTimeout(() => { logoClicksRef.current = 0; }, 1500);
      };

      // الضغط على شراء رواية: إلزامي التسجيل إن لم يكن مسجلاً
      const handleBuyClick = (book) => {
        if (!user) {
          setLoginReasonMsg('لتتمكن من إتمام عملية الشراء وحفظ الرواية في حسابك، يرجى تسجيل الدخول بحساب Google أولاً.');
          setPendingAction(() => () => {
            setActiveBookForPay(book);
            setView('checkout');
          });
          setShowGoogleModal(true);
        } else {
          setActiveBookForPay(book);
          setView('checkout');
        }
      };

      // الضغط على قراءة مجانية: إلزامي التسجيل إن لم يكن مسجلاً
      const handleFreeReadClick = (book) => {
        if (!user) {
          setLoginReasonMsg('للوصول المباشر للروايات والقصص المجانية، يرجى تسجيل الدخول بحساب Google أولاً.');
          setPendingAction(() => () => {
            if (book.pdfUrl) {
              window.open(book.pdfUrl, '_blank');
            } else {
              alert('جاري تجهيز الرواية للتحميل قريباً.');
            }
          });
          setShowGoogleModal(true);
        } else {
          if (book.pdfUrl) {
            window.open(book.pdfUrl, '_blank');
          } else {
            alert('جاري تجهيز الرواية للتحميل قريباً.');
          }
        }
      };

      // إتمام تسجيل الدخول عبر Google
      const submitGoogleLogin = (e) => {
        e.preventDefault();
        const emailToSave = inputEmail.trim() || 'reader@vayron.pub';
        const nameToSave = inputName.trim() || emailToSave.split('@')[0];

        const newUser = {
          name: nameToSave,
          email: emailToSave,
          avatar: `https://api.dicebear.com/7.x/initials/svg?seed=${nameToSave}&backgroundColor=b45309`,
          joinedAt: new Date().toLocaleString('ar-EG')
        };

        setUser(newUser);
        localStorage.setItem('vayron_customer_user', JSON.stringify(newUser));

        // حفظ في قائمة المشتركين إذا لم يكن موجوداً
        const exists = subscribers.some(sub => sub.email.toLowerCase() === emailToSave.toLowerCase());
        if (!exists) {
          const updatedSubs = [newUser, ...subscribers];
          setSubscribers(updatedSubs);
          localStorage.setItem('vayron_subscribers_list', JSON.stringify(updatedSubs));
        }

        setShowGoogleModal(false);
        setInputEmail('');
        setInputName('');

        // إكمال الحركة السابقة فوراً (شراء أو قراءة)
        if (pendingAction) {
          pendingAction();
          setPendingAction(null);
        }
      };

      const handleLogout = () => {
        setUser(null);
        localStorage.removeItem('vayron_customer_user');
        setShowUserMenu(false);
      };

      const verifyAdminPassword = (e) => {
        e.preventDefault();
        if (adminInputPass === ADMIN_SECRET_KEY) {
          setIsAdmin(true);
          setShowSecretModal(false);
          setAdminInputPass('');
          setAdminError(false);
          setView('admin');
        } else {
          setAdminError(true);
        }
      };

      const saveBooksToStorage = (updated) => {
        setBooks(updated);
        localStorage.setItem('vayron_books', JSON.stringify(updated));
      };

      const copyAddress = () => {
        navigator.clipboard.writeText(WALLET_ADDRESS);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const handleAddBook = (e) => {
        e.preventDefault();
        if (!newBook.titleAr) return;
        const bookToAdd = {
          ...newBook,
          id: Date.now(),
          price: newBook.isFree ? '0.00' : newBook.price
        };
        const updated = [bookToAdd, ...books];
        saveBooksToStorage(updated);
        alert('تم نشر الرواية بنجاح!');
        setNewBook({
          titleAr: '',
          titleEn: '',
          genre: 'psychological',
          price: '4.99',
          isFree: false,
          desc: '',
          coverUrl: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80',
          pdfUrl: ''
        });
        setView('books');
      };

      const handleDeleteBook = (id) => {
        if (confirm('تأكيد حذف هذه الرواية من المتجر؟')) {
          const updated = books.filter(b => b.id !== id);
          saveBooksToStorage(updated);
        }
      };

      const filteredBooks = selectedGenre === 'all' 
        ? books 
        : books.filter(b => b.genre === selectedGenre);

      return (
        <div className="min-h-screen flex flex-col justify-between selection:bg-amber-600/30">
          
          {/* Header راقٍ ومرتب */}
          <header className="border-b border-stone-800/80 bg-stone-950/80 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex justify-between items-center transition">
            <div className="flex items-center gap-3 cursor-pointer select-none" onClick={handleLogoSecretClick} title="VAYRON Publishing">
              <h1 className="text-3xl font-cinzel tracking-widest text-amber-500 font-bold hover:text-amber-400 transition">VAYRON</h1>
              <span className="text-[10px] tracking-widest text-stone-500 border-r border-stone-800 pr-3 hidden md:inline uppercase font-cinzel">NOTHING IS WHAT IT SEEMS</span>
            </div>
            
            <nav className="flex items-center gap-5 sm:gap-7 text-sm font-medium">
              <button 
                onClick={() => setView('home')} 
                className={`transition ${view === 'home' ? 'text-amber-400 font-bold' : 'text-stone-400 hover:text-stone-200'}`}
              >
                الرئيسية
              </button>
              <button 
                onClick={() => setView('books')} 
                className={`transition ${view === 'books' ? 'text-amber-400 font-bold' : 'text-stone-400 hover:text-stone-200'}`}
              >
                المكتبة ({books.length})
              </button>

              {isAdmin && (
                <button 
                  onClick={() => setView('admin')} 
                  className="text-amber-400 bg-amber-950/40 border border-amber-600/40 px-3 py-1 rounded text-xs flex items-center gap-1.5 hover:bg-amber-900/40 transition"
                >
                  <i className="fa-solid fa-shield-halved text-[11px]"></i>
                  <span>لوحة الإدارة</span>
                </button>
              )}

              {/* حساب الزبون */}
              {user ? (
                <div className="relative">
                  <button 
                    onClick={() => setShowUserMenu(!showUserMenu)}
                    className="flex items-center gap-2 bg-stone-900 border border-stone-800 hover:border-amber-500/50 px-3 py-1.5 rounded-full transition text-xs"
                  >
                    <img src={user.avatar} alt={user.name} className="w-5 h-5 rounded-full ring-1 ring-amber-500/50" />
                    <span className="max-w-[100px] truncate text-stone-200 font-medium">{user.name}</span>
                    <i className="fa-solid fa-chevron-down text-[9px] text-stone-500"></i>
                  </button>

                  {showUserMenu && (
                    <div className="absolute left-0 mt-2 w-52 bg-stone-900 border border-stone-800 rounded-xl shadow-2xl py-2 z-50 text-right">
                      <div className="px-4 py-2 border-b border-stone-800">
                        <p className="text-xs font-bold text-stone-200">{user.name}</p>
                        <p className="text-[11px] text-stone-500 truncate font-mono">{user.email}</p>
                      </div>
                      <button 
                        onClick={() => { setView('books'); setShowUserMenu(false); }}
                        className="w-full text-right px-4 py-2 text-xs text-stone-300 hover:bg-stone-800 transition"
                      >
                        <i className="fa-solid fa-book-bookmark ml-2 text-amber-500"></i> تصفح الروايات
                      </button>
                      <button 
                        onClick={handleLogout}
                        className="w-full text-right px-4 py-2 text-xs text-rose-400 hover:bg-stone-800 transition"
                      >
                        <i className="fa-solid fa-arrow-right-from-bracket ml-2"></i> تسجيل الخروج
                      </button>
                    </div>
                  )}
                </div>
              ) : (
                <button 
                  onClick={() => { setLoginReasonMsg(''); setShowGoogleModal(true); }}
                  className="bg-stone-900 hover:bg-stone-800 border border-stone-800 text-stone-300 text-xs px-3.5 py-1.5 rounded-full flex items-center gap-2 transition"
                >
                  <i className="fa-brands fa-google text-amber-500"></i>
                  <span>دخول عبر Google</span>
                </button>
              )}
            </nav>
          </header>

          {/* محتوى الصفحات */}
          <main className="flex-1 max-w-6xl mx-auto px-6 py-12 w-full">
            
            {/* الصفحة الرئيسية: واجهة سينمائية مرتبة وشرح اسم VAYRON */}
            {view === 'home' && (
              <div className="space-y-20">
                {/* Hero Section */}
                <div className="text-center space-y-6 max-w-3xl mx-auto pt-8">
                  <div className="inline-flex items-center gap-2 border border-amber-500/20 bg-amber-950/20 px-4 py-1.5 rounded-full">
                    <span className="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                    <span className="text-xs uppercase tracking-widest text-amber-400 font-cinzel">DIGITAL PUBLISHING HOUSE</span>
                  </div>

                  <h2 className="text-4xl sm:text-6xl font-bold leading-tight font-amiri text-stone-100">
                    حيث لا شيء كما يبدو <br />
                    <span className="text-amber-500">في عتمة السطور</span>
                  </h2>

                  <p className="text-stone-400 text-base sm:text-lg leading-relaxed font-light">
                    المقر الرقمي لأدب الغموض المعاصر، التحقيقات، وحبكات الإثارة النفسية التي تتجاوز المألوف.
                  </p>

                  <div className="pt-4 flex justify-center gap-4">
                    <button 
                      onClick={() => { setSelectedGenre('all'); setView('books'); }} 
                      className="bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold px-8 py-3.5 rounded-xl shadow-lg shadow-amber-900/20 transition text-sm flex items-center gap-2"
                    >
                      <i className="fa-solid fa-book-open"></i>
                      <span>استكشف المكتبة ({books.length})</span>
                    </button>
                    {!user && (
                      <button 
                        onClick={() => { setLoginReasonMsg(''); setShowGoogleModal(true); }}
                        className="bg-stone-900 hover:bg-stone-800 border border-stone-800 text-stone-300 font-bold px-6 py-3.5 rounded-xl transition text-sm flex items-center gap-2"
                      >
                        <i className="fa-brands fa-google text-amber-400"></i>
                        <span>انضم كقارئ</span>
                      </button>
                    )}
                  </div>
                </div>

                {/* قسم خاص: شرح فلسفة واسم VAYRON بطريقة فخمة */}
                <div className="bg-gradient-to-b from-stone-900/60 to-stone-950/90 border border-stone-800/80 rounded-3xl p-8 sm:p-12 relative overflow-hidden">
                  <div className="absolute top-0 right-0 w-64 h-64 bg-amber-600/5 rounded-full blur-3xl -z-10"></div>
                  
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-8 items-center">
                    <div className="space-y-2 border-l-0 md:border-l border-stone-800 md:pl-8">
                      <span className="text-amber-500 font-cinzel text-xs tracking-widest block uppercase">THE IDENTITY</span>
                      <h3 className="text-3xl font-bold font-cinzel text-stone-100">VAYRON</h3>
                      <p className="text-xs text-stone-500 font-mono">ما وراء الظلال • دار النشر الرقمي</p>
                    </div>

                    <div className="md:col-span-2 space-y-4 text-stone-300 leading-relaxed font-light text-sm sm:text-base">
                      <p>
                        <strong className="text-amber-400 font-bold">فايرون (VAYRON)</strong> ليس مجرد علامة أدبية، بل هو الحد الفاصل بين الحقيقة الراسخة والوهم الخفي. تم تأسيس الدار لتكون المنصة الأولى المتخصصة في تقديم أدب نفسي مكثف، حيث الغموض لا يقتصر على حل لغز جريمة، بل يغوص عميقاً في تعقيدات النفس البشرية وتناقضاتها.
                      </p>
                      <p className="text-stone-400 text-xs sm:text-sm">
                        كل عمل يصدر تحت مظلة <span className="text-stone-200 font-semibold">VAYRON</span> يلتزم بميثاق سردي صارم: حبكات مشوقة، تصاعد درامي يحبس الأنفاس، ونهايات لا يمكن التنبؤ بها، مع تجربة اقتناء رقمية عصرية مباشرة وسلسة.
                      </p>
                    </div>
                  </div>
                </div>

                {/* مميزات التجربة في VAYRON */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                  <div className="bg-stone-900/40 border border-stone-800/70 p-6 rounded-2xl space-y-3">
                    <div className="w-10 h-10 bg-amber-950/40 rounded-lg flex items-center justify-center text-amber-400 text-lg">
                      <i className="fa-solid fa-brain"></i>
                    </div>
                    <h4 className="text-base font-bold text-stone-200">إثارة نفسية معمقة</h4>
                    <p className="text-xs text-stone-400 leading-relaxed">روايات وقصص كُتبت بعناية لتأخذك إلى أروقة العقل الباطن ومتاهات الشك.</p>
                  </div>

                  <div className="bg-stone-900/40 border border-stone-800/70 p-6 rounded-2xl space-y-3">
                    <div className="w-10 h-10 bg-amber-950/40 rounded-lg flex items-center justify-center text-amber-400 text-lg">
                      <i className="fa-solid fa-shield-halved"></i>
                    </div>
                    <h4 className="text-base font-bold text-stone-200">دفع مشفر مباشر (USDT)</h4>
                    <p className="text-xs text-stone-400 leading-relaxed">اقتناء فوري ومستقل عبر شبكة TRON TRC20 بأعلى معايير الخصوصية.</p>
                  </div>

                  <div className="bg-stone-900/40 border border-stone-800/70 p-6 rounded-2xl space-y-3">
                    <div className="w-10 h-10 bg-amber-950/40 rounded-lg flex items-center justify-center text-amber-400 text-lg">
                      <i className="fa-solid fa-book-journal-whills"></i>
                    </div>
                    <h4 className="text-base font-bold text-stone-200">إصدارات مجانية وحصرية</h4>
                    <p className="text-xs text-stone-400 leading-relaxed">فصول ترويجية وروايات كاملة تُتاح للقراء المسجلين مجاناً ضمن الأقسام.</p>
                  </div>
                </div>
              </div>
            )}

            {/* صفحة المكتبة: عرض الروايات مع تفعيل الإلزام بالتسجيل */}
            {view === 'books' && (
              <div className="space-y-8">
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-stone-800 pb-5">
                  <div>
                    <h3 className="text-2xl font-bold text-stone-100 font-amiri">مكتبة الروايات المنشورة</h3>
                    <p className="text-xs text-stone-500 mt-1">اختر عملك الأدبي المفضل وابدأ القراءة</p>
                  </div>
                  
                  {/* أزرار الأقسام الأدبية */}
                  <div className="flex gap-2 text-xs flex-wrap items-center">
                    <button 
                      onClick={() => setSelectedGenre('all')} 
                      className={`px-3.5 py-1.5 rounded-lg transition ${selectedGenre === 'all' ? 'bg-amber-600 text-stone-950 font-bold' : 'bg-stone-900 text-stone-400 hover:text-stone-200 border border-stone-800'}`}
                    >
                      الكل
                    </button>
                    {GENRES.map(g => (
                      <button 
                        key={g.id}
                        onClick={() => setSelectedGenre(g.id)} 
                        className={`px-3.5 py-1.5 rounded-lg transition ${selectedGenre === g.id ? 'bg-amber-600 text-stone-950 font-bold' : 'bg-stone-900 text-stone-400 hover:text-stone-200 border border-stone-800'}`}
                      >
                        {g.labelAr}
                      </button>
                    ))}
                  </div>
                </div>

                {filteredBooks.length === 0 ? (
                  <div className="bg-stone-900/30 border border-stone-800/80 rounded-3xl p-16 text-center space-y-4">
                    <i className="fa-solid fa-feather-pointed text-4xl text-amber-500/50 mb-2"></i>
                    <h4 className="text-xl font-bold text-stone-200">لا توجد أعمال معروضة في هذا القسم حالياً</h4>
                    <p className="text-stone-500 max-w-md mx-auto text-xs">ترقبوا أولى إصدارات الدار الحصرية قريباً، أو تفضل بزيارة باقي الأقسام.</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {filteredBooks.map(book => (
                      <div key={book.id} className="bg-stone-900/70 border border-stone-800 rounded-2xl overflow-hidden flex flex-col justify-between group hover:border-amber-500/40 hover:shadow-2xl transition duration-300">
                        <div>
                          <div className="relative overflow-hidden">
                            <img src={book.coverUrl} alt={book.titleAr} className="w-full h-64 object-cover group-hover:scale-105 transition duration-500" />
                            {book.isFree && (
